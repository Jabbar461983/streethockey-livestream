<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Spiele – Swiss Streethockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --row-alt:#eeeeee;
  --border:#e2e2e2;
  --text:#1a1a1a;
  --muted:#6b6b6b;
  --accent:#e3000f;
  --goal:#1a1a1a;
  --live:#e3000f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px 14px 50px;
}
header{max-width:820px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.subtitle{color:var(--muted);font-size:13px}
.page-refresh{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:4px}
.wrap{max-width:820px;margin:0 auto}
.live-badge{
  display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:12px;
  text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;border-radius:4px;margin-bottom:14px;
}
.league-section{margin-bottom:22px}
.league-title{
  font-size:19px;font-weight:800;color:var(--text);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.league-title .chev{color:var(--muted);font-weight:400}
.games{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.game{border-bottom:1px solid var(--border)}
.game:last-child{border-bottom:none}
.game-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.game-row:nth-child(1){background:var(--card)}
.game:nth-child(even) .game-row{background:var(--row-alt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex-shrink:0}
.dot.goal{background:#1a9c4a;animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.teams-col{flex:1;min-width:0}
.team-line{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:3px 0}
.team-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#eee;position:relative}
.mini-avatar img{width:100%;height:100%;object-fit:contain;display:none}
.mini-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--muted)}
.score-col{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.res{font-size:15px;font-weight:800;color:var(--text);text-decoration:none;padding:2px 6px;border-radius:4px}
.res:hover{background:var(--row-alt)}
.game-time{font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.toggle{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-size:11px;padding:4px 10px;border-radius:14px;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:7px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.on{border-color:#1a9c4a;color:#1a9c4a}
.icon-btn.unsupported{opacity:.35;cursor:not-allowed}
.icon-btn.unsupported:hover{border-color:var(--border);color:var(--muted)}
.sound-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sp-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;min-width:0}
.sp-row:last-child{margin-bottom:0}
.sp-row label{flex-shrink:0;min-width:55px;padding-top:6px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sp-row select{flex:1;min-width:0;width:100%;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:13px;background:#fff;color:var(--text);box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-teams .team-box{flex:1;min-width:0}
.team-quick{display:flex;gap:12px;margin-bottom:6px}
.team-quick a{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline}
.team-list{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:#fff}
.team-list label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-transform:none}
.team-list input{cursor:pointer;width:15px;height:15px;flex-shrink:0}
.sp-checks{gap:16px;flex-wrap:wrap}
.sp-checks label{display:flex;align-items:center;gap:6px;min-width:auto;padding-top:0;text-transform:none;font-weight:500;color:var(--text);font-size:13px;cursor:pointer}
.sp-checks input{cursor:pointer;width:15px;height:15px}
.sp-save-row{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.sp-save{background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer}
.sp-save:hover{opacity:.9}
.events{display:none;padding:2px 14px 10px 46px;background:inherit}
.events.open{display:block}
.ev{font-size:12.5px;margin-bottom:6px;display:flex;align-items:flex-start;gap:7px;color:var(--text)}
.ev b{min-width:32px;color:var(--muted);font-weight:700}
.puck{width:8px;height:8px;border-radius:50%;background:#ff8c00;flex-shrink:0;margin-top:3px}
.wh{flex-shrink:0;margin-top:1px}
.empty{max-width:820px;margin:60px auto;text-align:center;color:var(--muted);font-size:15px}
footer{max-width:820px;margin:32px auto 0;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Live Spiele</h1>
    <div class="subtitle" id="subtitle">Wird geladen …</div>
  </div>
  <div class="header-actions">
    <button id="soundBtn" class="icon-btn" onclick="toggleSound()" title="Ton"></button>
    <button id="vibBtn" class="icon-btn" onclick="toggleVibration()" title="Vibration"></button>
    <button id="settingsBtn" class="icon-btn" onclick="toggleSettingsPanel()" title="Einstellungen"></button>
    <div class="page-refresh" id="pageRefresh"></div>
  </div>
</header>
<div class="wrap">
  <div id="soundPanel" class="sound-panel" style="display:none">
    <div class="sp-row">
      <label for="selClub">Verein</label>
      <select id="selClub" onchange="onClubChange()"></select>
    </div>
    <div class="sp-row sp-teams">
      <label>Teams</label>
      <div class="team-box">
        <div class="team-quick"><a onclick="selectAllTeams()">Alle</a><a onclick="selectNoTeams()">Keine</a></div>
        <div id="teamList" class="team-list"></div>
      </div>
    </div>
    <div class="sp-row sp-checks">
      <label><input type="checkbox" id="chkGoals" onchange="onEventToggle()"> Tore (Hupe)</label>
      <label><input type="checkbox" id="chkPenalties" onchange="onEventToggle()"> Strafen (Pfiff)</label>
      <label><input type="checkbox" id="chkEnd" onchange="onEventToggle()"> Spielende (Abpfiff)</label>
    </div>
    <div class="sp-save-row">
      <button class="sp-save" onclick="toggleSettingsPanel()">Speichern &amp; schliessen</button>
    </div>
  </div>
</div>
<div class="wrap" id="wrap"></div>

<footer>Daten: <a href="https://www.swiss-streethockey.ch" target="_blank" rel="noopener">Swiss Streethockey</a> · Aktualisiert sich automatisch alle 15 Sekunden</footer>

<script>
(function(){
var WORKER = "https://crimson-shadow-9fa2.ch-nessier.workers.dev";

var LEAGUES = [
  {id:292,  type:"liga",     name:"National League"},
  {id:300,  type:"liga",     name:"Swiss Cup"},
  {id:291,  type:"liga",     name:"Challenge League"},
  {id:2104, type:"division", name:"Classic League 2 – Ost"},
  {id:2105, type:"division", name:"Classic League 2 – West"},
  {id:295,  type:"liga",     name:"Damen"},
  {id:296,  type:"liga",     name:"U18"},
  {id:302,  type:"liga",     name:"Cup U15"},
  {id:2109, type:"division", name:"U15 – Grossfeld"},
  {id:2108, type:"division", name:"U15 – Kleinfeld"},
  {id:301,  type:"liga",     name:"Cup U12"},
  {id:2110, type:"division", name:"U12 – Grossfeld"},
  {id:2111, type:"division", name:"U12 – Kleinfeld"},
  {id:2113, type:"division", name:"U9 – Region A"},
  {id:2112, type:"division", name:"U9 – Region B"}
];

var REFRESH_SECONDS = 15;
var CATEGORY_ORDER = ["National League","Challenge League","Damen","U18","U15","U12","U9"];

// ============================================================
// Benachrichtigungen: Verein + mehrere Teams waehlbar, pro Ereignistyp an/aus,
// Kanal Ton und/oder Vibration
// ============================================================
var soundEnabled = localStorage.getItem("ssha_snd_on") !== "0";
var vibrationEnabled = localStorage.getItem("ssha_snd_vib") === "1";
var selectedClub = localStorage.getItem("ssha_snd_club") || "kernenried";
var selectedTeams = []; // wird nach CLUBS-Aufbau befuellt (Liste voller Teamnamen)
var wantGoals = localStorage.getItem("ssha_snd_goals") !== "0";
var wantPenalties = localStorage.getItem("ssha_snd_penalties") !== "0";
var wantEnd = localStorage.getItem("ssha_snd_end") !== "0";
var audioCtx = null;
var prevGoals = {};
var prevPenalties = {};
var prevLiveIds = {};
var CLUBS = {}; // wird nach TEAM_CLUB befuellt: slug -> {label, teams:[...]}

var ICON_GEAR = '<svg viewBox="0 0 24 24" width="16" height="16"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.2"/></g><g fill="currentColor"><rect x="11" y="1.2" width="2" height="3.6" rx="1"/><rect x="11" y="19.2" width="2" height="3.6" rx="1"/><rect x="1.2" y="11" width="3.6" height="2" rx="1"/><rect x="19.2" y="11" width="3.6" height="2" rx="1"/><rect x="4.3" y="4" width="2" height="3.6" rx="1" transform="rotate(45 5.3 5.8)"/><rect x="17.7" y="4" width="2" height="3.6" rx="1" transform="rotate(-45 18.7 5.8)"/><rect x="4.3" y="16.4" width="2" height="3.6" rx="1" transform="rotate(-45 5.3 18.2)"/><rect x="17.7" y="16.4" width="2" height="3.6" rx="1" transform="rotate(45 18.7 18.2)"/></g></svg>';
var ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.2 6a8.6 8.6 0 010 12"/></svg>';
var ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
var ICON_VIB_ON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M3 9v6M1 10.5v3M21 9v6M23 10.5v3"/></svg>';
var ICON_VIB_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 3l16 18" stroke-width="1.6"/></svg>';

var CLUB_LABELS = {
  "fribourg-dragons":"SHC Fribourg Dragons",
  "horgenberg":"Horgenberg Hammers",
  "oberwil":"Oberwil Rebells",
  "aegerten-bruegg":"SHC Aegerten-Brügg",
  "belpa":"SHC Belpa 1107",
  "berner-oberland":"SHC Berner Oberland",
  "bettlach":"SHC Bettlach",
  "bonstetten-wettswil":"SHC Bonstetten-Wettswil",
  "kernenried":"SHC Bulldozers Kernenried-Zauggenried",
  "diabla":"SHC Diabla / Valais",
  "erlinsbach":"SHC Erlinsbach",
  "grenchen-limpachtal":"SHC Grenchen-Limpachtal",
  "la-chaux-de-fonds":"SHC La Chaux-de-Fonds",
  "langenthal-devils":"SHC Langenthal Devils",
  "martigny":"SHC Martigny",
  "seetal-admirals":"SHC Seetal Admirals",
  "steckholz":"SHC Steckholz",
  "wild-sharks":"SHC Wild Sharks",
  "sierre":"Sierre Lions",
  "gals":"SV Gals"
};

function updateSoundButton() {
  var btn = document.getElementById("soundBtn");
  if (!btn) return;
  btn.innerHTML = soundEnabled ? ICON_SOUND_ON : ICON_SOUND_OFF;
  btn.classList.toggle("on", soundEnabled);
  btn.title = soundEnabled ? "Ton ausschalten" : "Ton einschalten";
}

function updateVibButton() {
  var btn = document.getElementById("vibBtn");
  if (!btn) return;
  var supported = "vibrate" in navigator;
  btn.innerHTML = vibrationEnabled ? ICON_VIB_ON : ICON_VIB_OFF;
  btn.classList.toggle("on", vibrationEnabled && supported);
  if (!supported) {
    btn.disabled = true;
    btn.classList.add("unsupported");
    btn.title = "Vibration wird von diesem Gerät/Browser nicht unterstützt (z.B. iPhone/Safari kennt keine Vibration im Web)";
  } else {
    btn.disabled = false;
    btn.classList.remove("unsupported");
    btn.title = vibrationEnabled ? "Vibration ausschalten" : "Vibration einschalten";
  }
}

function doVibrate(pattern) {
  if (vibrationEnabled && "vibrate" in navigator) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}

// Generischer Ton-Baustein: type = "sine"/"square"/"sawtooth" usw.
function playTone(type, freq, startOffset, dauer, vol) {
  var ctx = initAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(ctx.destination);
  var t = ctx.currentTime + startOffset;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.linearRampToValueAtTime(0, t + dauer);
  osc.start(t);
  osc.stop(t + dauer + 0.05);
}

// Tor = Hupe (zwei leicht dissonante Sägezahn-Töne, wie ein Autohorn)
function fireGoal(anzahl) {
  if (!wantGoals) return;
  if (soundEnabled && audioCtx) {
    var n = Math.min(anzahl, 3);
    for (var i = 0; i < n; i++) {
      var t = i * 0.55;
      playTone("sawtooth", 300, t, 0.42, 0.22);
      playTone("sawtooth", 377, t, 0.42, 0.16);
    }
  }
  doVibrate([180, 90, 180, 90, 180]);
}

// Strafe = einzelner kurzer Schiedsrichterpfiff
function firePenalty(anzahl) {
  if (!wantPenalties) return;
  if (soundEnabled && audioCtx) {
    var n = Math.min(anzahl, 3);
    for (var i = 0; i < n; i++) {
      playTone("square", 2200, i * 0.45, 0.28, 0.18);
    }
  }
  doVibrate([150]);
}

// Spielende = Abpfiff im Fussball-Stil: kurz - kurz - lang
function fireEnd() {
  if (!wantEnd) return;
  if (soundEnabled && audioCtx) {
    playTone("square", 2200, 0, 0.16, 0.2);
    playTone("square", 2200, 0.26, 0.16, 0.2);
    playTone("square", 2200, 0.52, 0.55, 0.22);
  }
  doVibrate([120, 90, 120, 90, 320]);
}

window.toggleSound = function() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("ssha_snd_on", soundEnabled ? "1" : "0");
  updateSoundButton();
  var ctx = initAudio();
  if (ctx && ctx.state === "suspended") ctx.resume();
  if (soundEnabled) playTone("sine", 660, 0, 0.15, 0.25); // kurze Bestaetigung beim Einschalten
};

window.toggleVibration = function() {
  vibrationEnabled = !vibrationEnabled;
  localStorage.setItem("ssha_snd_vib", vibrationEnabled ? "1" : "0");
  updateVibButton();
  if (vibrationEnabled) doVibrate([150]); // kurze Bestaetigung beim Einschalten
};

function matchesSelection(teamName) {
  if (!teamName) return false;
  if (clubSlugFor(teamName) !== selectedClub) return false;
  return selectedTeams.indexOf(teamName) !== -1;
}

function resetEventTracking() {
  prevGoals = {};
  prevPenalties = {};
  prevLiveIds = {};
}

// Prueft alle Spiele des gewaehlten Vereins/Teams auf NEUE Tore (beider Teams),
// NEUE Strafen (beider Teams) und auf ein soeben beendetes Spiel - und spielt
// bei Bedarf das jeweilige Signal.
function checkOwnEvents(games) {
  var currentLiveIds = {};
  games.forEach(function(g) {
    var home = text(g.doc, "spielheimTeamShort");
    var away = text(g.doc, "spielgastTeamShort");
    if (!matchesSelection(home) && !matchesSelection(away)) return;
    if (g.status !== "live") return;
    var spielnr = text(g.doc, "spielnr");
    currentLiveIds[spielnr] = true;
    var goalCnt = 0, penCnt = 0;
    Array.prototype.slice.call(g.doc.getElementsByTagName("message")).forEach(function(m) {
      var e = parseEvent(text(m, "text"));
      // Tore beider Teams zaehlen - Hupe ertoent bei jedem Tor im Spiel des gewaehlten Vereins/Teams
      if (e.type === "goal") goalCnt++;
      if (e.type === "penalty") penCnt++;
    });
    var prevG = prevGoals[spielnr];
    if (prevG !== undefined && goalCnt > prevG) fireGoal(goalCnt - prevG);
    prevGoals[spielnr] = goalCnt;
    var prevP = prevPenalties[spielnr];
    if (prevP !== undefined && penCnt > prevP) firePenalty(penCnt - prevP);
    prevPenalties[spielnr] = penCnt;
  });
  Object.keys(prevLiveIds).forEach(function(nr) {
    if (!currentLiveIds[nr]) fireEnd();
  });
  prevLiveIds = currentLiveIds;
}

// ---- Einstellungspanel (Verein/Teams/Ereignistypen) ----
window.toggleSettingsPanel = function() {
  var p = document.getElementById("soundPanel");
  p.style.display = (p.style.display === "none" || !p.style.display) ? "block" : "none";
};

function defaultTeamsForClub(slug) {
  var club = CLUBS[slug];
  return club ? club.teams.slice() : [];
}

function saveSelectedTeams() {
  localStorage.setItem("ssha_snd_teams", JSON.stringify(selectedTeams));
}

function buildClubOptions() {
  var sel = document.getElementById("selClub");
  if (!sel) return;
  var slugs = Object.keys(CLUBS).sort(function(a, b) { return CLUBS[a].label.localeCompare(CLUBS[b].label); });
  sel.innerHTML = slugs.map(function(s) { return '<option value="' + s + '">' + CLUBS[s].label + '</option>'; }).join("");
  sel.value = selectedClub;
}

function buildTeamCheckboxes() {
  var box = document.getElementById("teamList");
  if (!box) return;
  var teams = defaultTeamsForClub(selectedClub).sort();
  box.innerHTML = teams.map(function(t) {
    var checked = selectedTeams.indexOf(t) !== -1 ? "checked" : "";
    return '<label><input type="checkbox" value="' + t.replace(/"/g, "&quot;") + '" ' + checked + ' onchange="onTeamCheckChange()"> ' + t + '</label>';
  }).join("");
}

window.onClubChange = function() {
  selectedClub = document.getElementById("selClub").value;
  selectedTeams = defaultTeamsForClub(selectedClub); // Default: ganzer Verein (alle Teams angehakt)
  localStorage.setItem("ssha_snd_club", selectedClub);
  saveSelectedTeams();
  buildTeamCheckboxes();
  resetEventTracking();
};

window.onTeamCheckChange = function() {
  var box = document.getElementById("teamList");
  selectedTeams = Array.prototype.slice.call(box.querySelectorAll("input:checked")).map(function(cb) { return cb.value; });
  saveSelectedTeams();
  resetEventTracking();
};

window.selectAllTeams = function() {
  selectedTeams = defaultTeamsForClub(selectedClub);
  saveSelectedTeams();
  buildTeamCheckboxes();
  resetEventTracking();
};

window.selectNoTeams = function() {
  selectedTeams = [];
  saveSelectedTeams();
  buildTeamCheckboxes();
  resetEventTracking();
};

window.onEventToggle = function() {
  wantGoals = document.getElementById("chkGoals").checked;
  wantPenalties = document.getElementById("chkPenalties").checked;
  wantEnd = document.getElementById("chkEnd").checked;
  localStorage.setItem("ssha_snd_goals", wantGoals ? "1" : "0");
  localStorage.setItem("ssha_snd_penalties", wantPenalties ? "1" : "0");
  localStorage.setItem("ssha_snd_end", wantEnd ? "1" : "0");
};

function initSettingsUI() {
  // gespeicherte Team-Auswahl laden, aber nur die Teams uebernehmen, die
  // tatsaechlich noch zum gewaehlten Verein gehoeren
  var stored = [];
  try { stored = JSON.parse(localStorage.getItem("ssha_snd_teams") || "[]"); } catch (e) { stored = []; }
  var valid = defaultTeamsForClub(selectedClub);
  var filtered = stored.filter(function(t) { return valid.indexOf(t) !== -1; });
  selectedTeams = filtered.length ? filtered : valid;

  buildClubOptions();
  buildTeamCheckboxes();
  document.getElementById("chkGoals").checked = wantGoals;
  document.getElementById("chkPenalties").checked = wantPenalties;

function text(node, tag) {

function todayGerman() {
  var d = new Date();
  var pad = function(n) { return (n < 10 ? "0" : "") + n; };
  return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();
}

function fetchXml(url) {
  return fetch(url).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(t) {
    var doc = new DOMParser().parseFromString(t, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("XML parse error");
    return doc;
  });
}

function getCurrentSeasonId() {
  return fetchXml(WORKER + "/?path=xml/configuration.aspx&id=0&_=" + Date.now()).then(function(cfg) {
    var seasons = Array.prototype.slice.call(cfg.getElementsByTagName("saison"));
    var current = seasons.filter(function(s) { return text(s, "iscurrent") === "True"; })[0];
    return current ? text(current, "id") : "";
  });
}

function findCandidates() {
  var today = todayGerman();
  return Promise.all(LEAGUES.map(function(league) {
    // list=all statt list=open: so bleiben auch soeben beendete Spiele
    // (die evtl. schon als "gespielt" markiert sind) in der Liste,
    // damit wir sie noch bis 1 Std. nach Spielende zeigen können.
    var url = WORKER + "/?path=xml/spielplan.aspx&id=" + league.id + "&typ=" + league.type + "&list=all";
    return fetchXml(url).then(function(doc) {
      return Array.prototype.slice.call(doc.getElementsByTagName("Spiel"))
        .filter(function(spiel) {
          return text(spiel, "datum").indexOf(today) === 0 && text(spiel, "livetickeron") === "1";
        })
        .map(function(spiel) {
          return { spielnr: text(spiel, "spielnr"), league: league };
        });
    }).catch(function() { return []; });
  })).then(function(lists) {
    return [].concat.apply([], lists);
  });
}

var SICHTBAR_NACH_ENDE_MS = 60 * 60 * 1000; // 1 Stunde

function checkLive(candidate, seasonId) {
  var url = WORKER + "/?path=xml/liveticker.aspx&spielnr=" + candidate.spielnr + "&saisonid=" + seasonId + "&_=" + Date.now();
  return fetchXml(url).then(function(doc) {
    var started = text(doc, "spielbeginn");
    var ended = text(doc, "spielende");
    if (!started) return null; // noch nicht begonnen
    if (!ended) {
      return { doc: doc, league: candidate.league, seasonId: seasonId, status: "live" };
    }
    // Spiel beendet: nur zeigen, wenn letztes Update höchstens 1 Std. her ist
    var alterMs = Date.now() - parseUpdateTime(text(doc, "last_updated"));
    if (alterMs <= SICHTBAR_NACH_ENDE_MS) {
      return { doc: doc, league: candidate.league, seasonId: seasonId, status: "finished" };
    }
    return null;
  }).catch(function() { return null; });
}

function parseEvent(rawText) {
  var goalMatch = rawText.match(/^Tor für (.+?) durch (.+?)(?: auf Pass von (.+?))?\.\s*Neuer Spielstand (\d+:\d+)/);
  if (goalMatch) {
    return { type: "goal", team: goalMatch[1], scorer: goalMatch[2], assists: goalMatch[3], score: goalMatch[4] };
  }
  var penaltyMatch1 = rawText.match(/^(\d+)\s*Minutenstrafe für (.+?)\s*\((.+?)\)/);
  if (penaltyMatch1) {
    return { type: "penalty", minutes: penaltyMatch1[1] + " Min.", player: penaltyMatch1[2], team: penaltyMatch1[3] };
  }
  var penaltyMatch2 = rawText.match(/^Bankstrafen? gegen (.+?)\.\s*Die Strafe wird abgesessen von (.+)/);
  if (penaltyMatch2) {
    return { type: "penalty", minutes: "", player: penaltyMatch2[2], team: penaltyMatch2[1] };
  }
  return { type: "other", text: rawText };
}

function renderEvent(time, rawText) {
  var e = parseEvent(rawText);
  if (e.type === "goal") {
    var sub = e.scorer + (e.assists ? " – " + e.assists.replace(" und ", " / ") : "");
    return '<div class="ev"><b>' + time + '</b><span class="puck"></span><div>' + e.score + ' ' + e.team + '<div style="font-size:10.5px;color:var(--muted);margin-top:1px">' + sub + '</div></div></div>';
  }
  if (e.type === "penalty") {
    return '<div class="ev"><b>' + time + '</b>' + WHISTLE + '<div>' + e.team + (e.minutes ? ' · ' + e.minutes : '') + ' / ' + e.player + '</div></div>';
  }
  return '<div class="ev"><b>' + time + '</b><div>' + rawText + '</div></div>';
}

function categoryFor(leagueName) {
  if (leagueName.indexOf("Classic League") !== -1) return "Classic League";
  var base = leagueName.split(" – ")[0];
  return base;
}
function categoryOrderIndex(category) {
  var idx = CATEGORY_ORDER.indexOf(category);
  if (idx !== -1) return idx;
  if (category === "Classic League") return 999;
  return CATEGORY_ORDER.length;
}

// Zaehlt die Tore direkt aus den Ticker-Meldungen zusammen (statt das
// separate Zahlen-Feld von SSHA zu uebernehmen, das gelegentlich schon
// aktualisiert ist, bevor die zugehoerige Tor-Meldung eingetragen wurde).
function zaehleTore(allMessages, home, away) {
  var homeGoals = 0, awayGoals = 0;
  allMessages.forEach(function(m) {
    var e = parseEvent(text(m, "text"));
    if (e.type !== "goal") return;
    if (home.indexOf(e.team) !== -1 || e.team.indexOf(home) !== -1) homeGoals++;
    else if (away.indexOf(e.team) !== -1 || e.team.indexOf(away) !== -1) awayGoals++;
  });
  return { home: homeGoals, away: awayGoals };
}

var uidCounter = 0;

function renderGameRow(game) {
  var d = game.doc;
  var home = text(d, "spielheimTeamShort");
  var away = text(d, "spielgastTeamShort");
  var allMessages = Array.prototype.slice.call(d.getElementsByTagName("message")).reverse();
  var eventsHtml = allMessages.map(function(m) { return renderEvent(text(m, "spielzeit"), text(m, "text")); }).join("") || "<p style='color:var(--muted);font-size:12px'>Noch keine Ereignisse.</p>";
  var detailUrl = isDemo
    ? "spiel.html?demo=1"
    : "spiel.html?spielnr=" + text(d, "spielnr") + "&saisonid=" + game.seasonId;
  var uid = "ev" + (uidCounter++);
  var updated = text(d, "last_updated").split(" ")[1] || "";
  var tore = zaehleTore(allMessages, home, away);

  // Grün blinkt nur, wenn dieses Spiel (global über alle Ligen/Spiele hinweg)
  // das zeitlich neueste Tor hat - siehe Berechnung in renderGrouped()
  var dotHtml = "";
  if (game.status === "live") {
    var dotClass = "dot" + (game._istNeuestesTor ? " goal" : "");
    dotHtml = '<span class="' + dotClass + '"></span>';
  }

  return '<div class="game">' +
    '<div class="game-row">' +
    dotHtml +
    '<div class="teams-col">' +
      '<div class="team-line">' + renderAvatar(home) + '<span>' + home + '</span></div>' +
      '<div class="team-line">' + renderAvatar(away) + '<span>' + away + '</span></div>' +
    '</div>' +
    '<div class="score-col">' +
      '<a class="res" href="' + detailUrl + '">' + tore.home + '</a>' +
      '<a class="res" href="' + detailUrl + '">' + tore.away + '</a>' +
      '<div class="game-time">Update: ' + updated + '</div>' +
    '</div>' +
    '<button class="toggle" onclick="var e=document.getElementById(\'' + uid + '\');e.classList.toggle(\'open\');this.textContent=e.classList.contains(\'open\')?\'Verbergen\':\'Ereignisse\';">Ereignisse</button>' +
    '</div>' +
    '<div class="events" id="' + uid + '">' + eventsHtml + '</div>' +
    '</div>';
}

function parseUpdateTime(lastUpdated) {
  // Format: "06.09.2026 14:25:46" -> vergleichbarer Zeitwert
  var parts = lastUpdated.split(" ");
  var datum = (parts[0] || "").split(".");
  var zeit = (parts[1] || "0:0:0").split(":");
  return new Date(+datum[2], +datum[1] - 1, +datum[0], +zeit[0], +zeit[1], +zeit[2] || 0).getTime();
}

function renderGrouped(games) {
  // Über ALLE Spiele hinweg ermitteln, wo zuletzt ein Tor gefallen ist.
  // Nur das/die Spiel(e) mit dem zeitlich neuesten Tor blinken grün.
  var maxGoalTime = -1;
  games.forEach(function(g) {
    if (g.status !== "live") return;
    var msgs = Array.prototype.slice.call(g.doc.getElementsByTagName("message")).reverse();
    var letztesIstTor = msgs.length > 0 && parseEvent(text(msgs[0], "text")).type === "goal";
    g._letztesIstTor = letztesIstTor;
    g._updateTime = parseUpdateTime(text(g.doc, "last_updated"));
    if (letztesIstTor && g._updateTime > maxGoalTime) maxGoalTime = g._updateTime;
  });
  games.forEach(function(g) {
    g._istNeuestesTor = g._letztesIstTor && g._updateTime === maxGoalTime && maxGoalTime > -1;
  });

  var byCategory = {};
  games.forEach(function(g) {
    var cat = categoryFor(g.league.name);
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(g);
  });
  var categories = Object.keys(byCategory).sort(function(a, b) {
    return categoryOrderIndex(a) - categoryOrderIndex(b);
  });
  wrap.innerHTML = '<div class="live-badge">Live</div>' + categories.map(function(cat) {
    return '<div class="league-section">' +
      '<div class="league-title">' + cat + ' <span class="chev">›</span></div>' +
      '<div class="games">' + byCategory[cat].map(renderGameRow).join("") + '</div>' +
      '</div>';
  }).join("");
}

function run() {
  if (new URLSearchParams(location.search).get("demo")) {
    runDemo();
    return;
  }
  getCurrentSeasonId().then(function(seasonId) {
    if (!seasonId) {
      subtitle.textContent = "Saison konnte nicht ermittelt werden.";
      return;
    }
    findCandidates().then(function(candidates) {
      if (!candidates.length) {
        checkOwnEvents([]);
        subtitle.textContent = "Aktuell läuft kein Spiel.";
        wrap.innerHTML = "";
        markPageRefreshed();
        return;
      }
      Promise.all(candidates.map(function(c) { return checkLive(c, seasonId); })).then(function(results) {
        var games = results.filter(function(g) { return g; });
        if (!games.length) {
          checkOwnEvents([]);
          subtitle.textContent = "Aktuell läuft kein Spiel.";
          wrap.innerHTML = "";
          markPageRefreshed();
          return;
        }
        checkOwnEvents(games);
        var liveCount = games.filter(function(g) { return g.status === "live"; }).length;
        var finishedCount = games.length - liveCount;
        var teile = [];
        if (liveCount > 0) teile.push(liveCount + " Spiel" + (liveCount > 1 ? "e" : "") + " laufen gerade");
        if (finishedCount > 0) teile.push(finishedCount + " Resultat" + (finishedCount > 1 ? "e" : "") + " der letzten Stunde");
        subtitle.textContent = teile.join(" · ");
        renderGrouped(games);
        markPageRefreshed();
      });
    });
  });
}
