<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Spiele – Swiss Streethockey</title>
<style>
:root{
  --bg:#0e1117;
  --card:#161b22;
  --border:rgba(255,255,255,.08);
  --text:#f0f2f5;
  --muted:rgba(240,242,245,.55);
  --accent:#3ea6ff;
  --goal:#ff8c00;
  --live:#ff4d4f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px 14px 50px;
}
header{max-width:820px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.subtitle{color:var(--muted);font-size:13px}
.page-refresh{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:4px}
.wrap{max-width:820px;margin:0 auto}
.league-section{margin-bottom:18px}
.league-title{
  font-size:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;
  color:var(--accent);padding:0 4px 6px;border-bottom:1px solid rgba(62,166,255,.25);
  margin-bottom:2px;
}
.games{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.game{border-bottom:1px solid var(--border)}
.game:last-child{border-bottom:none}
.game-row{display:flex;align-items:center;gap:8px;padding:7px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--live);flex-shrink:0;animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.team-abbr{font-weight:700;font-size:13px;width:36px;text-align:center;flex-shrink:0}
.mini-avatar{width:20px;height:20px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.06);position:relative}
.mini-avatar img{width:100%;height:100%;object-fit:contain;display:none}
.mini-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:var(--muted)}
.res{font-size:15px;font-weight:800;color:var(--text);text-decoration:none;white-space:nowrap}
.res:hover{color:var(--accent)}
.game-time{font-size:11px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.toggle{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-size:11px;padding:3px 9px;border-radius:12px;cursor:pointer;white-space:nowrap;
}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.events{display:none;padding:2px 10px 8px 44px}
.events.open{display:block}
.ev{font-size:12px;margin-bottom:5px;display:flex;align-items:flex-start;gap:6px;color:rgba(240,242,245,.85)}
.ev b{min-width:32px;color:var(--muted);font-weight:600}
.ball{width:8px;height:8px;border-radius:50%;background:var(--goal);flex-shrink:0;margin-top:3px}
.wh{flex-shrink:0;margin-top:1px}
.empty{max-width:820px;margin:60px auto;text-align:center;color:var(--muted);font-size:15px}
footer{max-width:820px;margin:32px auto 0;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>

function kuerzelFor(teamName) {
  if (TEAM_KUERZEL[teamName]) return TEAM_KUERZEL[teamName];
  return teamName.replace(/^(SHC|SV|HC)\s+/, "").substring(0, 3).toUpperCase();
}
function clubSlugFor(teamName) {
  if (TEAM_CLUB[teamName]) return TEAM_CLUB[teamName];
  return teamName.replace(/^(SHC|SV|HC)\s+/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function renderAvatar(teamName) {
  var initials = kuerzelFor(teamName);
  var slug = clubSlugFor(teamName);
  return '<div class="mini-avatar"><div class="mini-fallback">' + initials.substring(0,2) + '</div>' +
    '<img src="logos/' + slug + '.png" alt="" ' +
    'onload="this.style.display=\'block\';this.previousElementSibling.style.display=\'none\'" ' +
    'onerror="this.remove()"></div>';
}

function text(node, tag) {
  var el = node.getElementsByTagName(tag)[0];
  return el ? el.textContent.trim() : "";
}

function todayGerman() {
  var d = new Date();
  var pad = function(n) { return (n < 10 ? "0" : "") + n; };
  return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();
}

function fetchXml(url) {
  return fetch(url).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(t) {
    var doc = new DOMParser().parseFromString(t, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("XML parse error");
    return doc;
  });
}

function getCurrentSeasonId() {
  return fetchXml(WORKER + "/?path=xml/configuration.aspx&id=0&_=" + Date.now()).then(function(cfg) {
    var seasons = Array.prototype.slice.call(cfg.getElementsByTagName("saison"));
    var current = seasons.filter(function(s) { return text(s, "iscurrent") === "True"; })[0];
    return current ? text(current, "id") : "";
  });
}

function findCandidates() {
  var today = todayGerman();
  return Promise.all(LEAGUES.map(function(league) {
    var url = WORKER + "/?path=xml/spielplan.aspx&id=" + league.id + "&typ=" + league.type + "&list=open";
    return fetchXml(url).then(function(doc) {
      return Array.prototype.slice.call(doc.getElementsByTagName("Spiel"))
        .filter(function(spiel) {
          return text(spiel, "datum").indexOf(today) === 0 && text(spiel, "livetickeron") === "1";
        })
        .map(function(spiel) {
          return { spielnr: text(spiel, "spielnr"), league: league };
        });
    }).catch(function() { return []; });
  })).then(function(lists) {
    return [].concat.apply([], lists);
  });
}

function checkLive(candidate, seasonId) {
  var url = WORKER + "/?path=xml/liveticker.aspx&spielnr=" + candidate.spielnr + "&saisonid=" + seasonId + "&_=" + Date.now();
  return fetchXml(url).then(function(doc) {
    var started = text(doc, "spielbeginn");
    var ended = text(doc, "spielende");
    if (started && !ended) {
      return { doc: doc, league: candidate.league, seasonId: seasonId };
    }
    return null;
  }).catch(function() { return null; });
}

function parseEvent(rawText) {
  var goalMatch = rawText.match(/^Tor für (.+?) durch (.+?)(?: auf Pass von (.+?))?\.\s*Neuer Spielstand (\d+:\d+)/);
  if (goalMatch) {
    return { type: "goal", team: goalMatch[1], scorer: goalMatch[2], assists: goalMatch[3], score: goalMatch[4] };
  }
  var penaltyMatch1 = rawText.match(/^(\d+)\s*Minutenstrafe für (.+?)\s*\((.+?)\)/);
  if (penaltyMatch1) {
    return { type: "penalty", minutes: penaltyMatch1[1] + " Min.", player: penaltyMatch1[2], team: penaltyMatch1[3] };
  }
  var penaltyMatch2 = rawText.match(/^Bankstrafen? gegen (.+?)\.\s*Die Strafe wird abgesessen von (.+)/);
  if (penaltyMatch2) {
    return { type: "penalty", minutes: "", player: penaltyMatch2[2], team: penaltyMatch2[1] };
  }
  return { type: "other", text: rawText };
}

function renderEvent(time, rawText) {
  var e = parseEvent(rawText);
  if (e.type === "goal") {
    var sub = e.scorer + (e.assists ? " – " + e.assists.replace(" und ", " / ") : "");
    return '<div class="ev"><b>' + time + '</b><span class="ball"></span><div>' + e.score + ' ' + e.team + '<div style="font-size:10.5px;color:var(--muted);margin-top:1px">' + sub + '</div></div></div>';
  }
  if (e.type === "penalty") {
    return '<div class="ev"><b>' + time + '</b>' + WHISTLE + '<div>' + e.team + (e.minutes ? ' · ' + e.minutes : '') + ' / ' + e.player + '</div></div>';
  }
  return '<div class="ev"><b>' + time + '</b><div>' + rawText + '</div></div>';
}

function categoryFor(leagueName) {
  if (leagueName.indexOf("Classic League") !== -1) return "Classic League";
  var base = leagueName.split(" – ")[0];
  return base;
}
function categoryOrderIndex(category) {
  var idx = CATEGORY_ORDER.indexOf(category);
  if (idx !== -1) return idx;
  if (category === "Classic League") return 999;
  return CATEGORY_ORDER.length;
}

var uidCounter = 0;

function renderGameRow(game) {
  var d = game.doc;
  var home = text(d, "spielheimTeamShort");
  var away = text(d, "spielgastTeamShort");
  var allMessages = Array.prototype.slice.call(d.getElementsByTagName("message")).reverse();
  var eventsHtml = allMessages.map(function(m) { return renderEvent(text(m, "spielzeit"), text(m, "text")); }).join("") || "<p style='color:var(--muted);font-size:12px'>Noch keine Ereignisse.</p>";
  var detailUrl = "spiel.html?spielnr=" + text(d, "spielnr") + "&saisonid=" + game.seasonId;
  var uid = "ev" + (uidCounter++);
  var updated = text(d, "last_updated").split(" ")[1] || "";

  return '<div class="game">' +
    '<div class="game-row">' +
    '<span class="dot"></span>' +
    renderAvatar(home) + '<div class="team-abbr">' + kuerzelFor(home) + '</div>' +
    '<a class="res" href="' + detailUrl + '">' + text(d, "spieltoreheim") + ':' + text(d, "spieltoregast") + '</a>' +
    '<div class="team-abbr">' + kuerzelFor(away) + '</div>' + renderAvatar(away) +
    '<span class="game-time">' + updated + '</span>' +
    '<span class="spacer"></span>' +
    '<button class="toggle" onclick="var e=document.getElementById(\'' + uid + '\');e.classList.toggle(\'open\');this.textContent=e.classList.contains(\'open\')?\'Verbergen\':\'Ereignisse\';">Ereignisse</button>' +
    '</div>' +
    '<div class="events" id="' + uid + '">' + eventsHtml + '</div>' +
    '</div>';
}

function renderGrouped(games) {
  var byCategory = {};
  games.forEach(function(g) {
    var cat = categoryFor(g.league.name);
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(g);
  });
  var categories = Object.keys(byCategory).sort(function(a, b) {
    return categoryOrderIndex(a) - categoryOrderIndex(b);
  });
  wrap.innerHTML = categories.map(function(cat) {
    return '<div class="league-section">' +
      '<div class="league-title">' + cat + '</div>' +
      '<div class="games">' + byCategory[cat].map(renderGameRow).join("") + '</div>' +
      '</div>';
  }).join("");
}

function run() {
  if (new URLSearchParams(location.search).get("demo")) {
    runDemo();
    return;
  }
  getCurrentSeasonId().then(function(seasonId) {
    if (!seasonId) {
      subtitle.textContent = "Saison konnte nicht ermittelt werden.";
      return;
    }
    findCandidates().then(function(candidates) {
      if (!candidates.length) {
        subtitle.textContent = "Aktuell läuft kein Spiel.";
        wrap.innerHTML = "";
        markPageRefreshed();
        return;
      }
      Promise.all(candidates.map(function(c) { return checkLive(c, seasonId); })).then(function(results) {
        var liveGames = results.filter(function(g) { return g; });
        if (!liveGames.length) {
          subtitle.textContent = "Aktuell läuft kein Spiel.";
          wrap.innerHTML = "";
          markPageRefreshed();
          return;
        }
        subtitle.textContent = liveGames.length + " Spiel" + (liveGames.length > 1 ? "e" : "") + " laufen gerade";
        renderGrouped(liveGames);
        markPageRefreshed();
      });
    });
  });
}

function makeDemoXml(cfg) {
  var msgsXml = (cfg.messages || []).map(function(m) {
    return '<message><spielzeit><![CDATA[' + m.time + ']]></spielzeit><text><![CDATA[' + m.text + ']]></text></message>';
  }).join("");
  return '<ihs><liveticker>' +
    '<last_updated><![CDATA[06.09.2026 ' + cfg.updated + ']]></last_updated>' +
    '<spielnr><![CDATA[' + cfg.spielnr + ']]></spielnr>' +
    '<spielort><![CDATA[' + cfg.ort + ']]></spielort>' +
    '<spielbeginn><![CDATA[13:57]]></spielbeginn><spielende><![CDATA[]]></spielende>' +
    '<spielheimTeamShort><![CDATA[' + cfg.home + ']]></spielheimTeamShort>' +
    '<spielgastTeamShort><![CDATA[' + cfg.away + ']]></spielgastTeamShort>' +
    '<spieltoreheim><![CDATA[' + cfg.hs + ']]></spieltoreheim><spieltoregast><![CDATA[' + cfg.as + ']]></spieltoregast>' +
    '<messages>' + msgsXml + '</messages>' +
    '</liveticker></ihs>';
