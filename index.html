<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Spiele – Swiss Streethockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --row-alt:#eeeeee;
  --border:#e2e2e2;
  --text:#1a1a1a;
  --muted:#6b6b6b;
  --accent:#e3000f;
  --goal:#1a1a1a;
  --live:#e3000f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px 14px 50px;
}
header{max-width:820px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.subtitle{color:var(--muted);font-size:13px}
.page-refresh{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:4px}
.wrap{max-width:820px;margin:0 auto}
.live-badge{
  display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:12px;
  text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;border-radius:4px;margin-bottom:14px;
}
.league-section{margin-bottom:22px}
.league-title{
  font-size:19px;font-weight:800;color:var(--text);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.league-title .chev{color:var(--muted);font-weight:400}
.games{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.game{border-bottom:1px solid var(--border)}
.game:last-child{border-bottom:none}
.game-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.game-row:nth-child(1){background:var(--card)}
.game:nth-child(even) .game-row{background:var(--row-alt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex-shrink:0}
.dot.goal{background:#1a9c4a;animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.teams-col{flex:1;min-width:0}
.team-line{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:3px 0}
.team-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#eee;position:relative}
.mini-avatar img{width:100%;height:100%;object-fit:contain;display:none}
.mini-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--muted)}
.score-col{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.res{font-size:15px;font-weight:800;color:var(--text);text-decoration:none;padding:2px 6px;border-radius:4px}
.res:hover{background:var(--row-alt)}
.res.sched{font-size:13px;font-weight:700;color:var(--muted);background:var(--row-alt);padding:3px 8px}
.game-time{font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.toggle{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-size:11px;padding:4px 10px;border-radius:14px;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:7px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.on{border-color:#1a9c4a;color:#1a9c4a}
.icon-btn.unsupported{opacity:.35;cursor:not-allowed}
.icon-btn.unsupported:hover{border-color:var(--border);color:var(--muted)}
.sound-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sp-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;min-width:0}
.sp-row:last-child{margin-bottom:0}
.sp-row label{flex-shrink:0;min-width:55px;padding-top:6px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sp-row select{flex:1;min-width:0;width:100%;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:13px;background:#fff;color:var(--text);box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-teams .team-box{flex:1;min-width:0}
.team-quick{display:flex;gap:12px;margin-bottom:6px}
.team-quick a{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline}
.team-list{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:#fff}
.team-list label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-transform:none}
.team-list input{cursor:pointer;width:15px;height:15px;flex-shrink:0}
.sp-checks{gap:16px;flex-wrap:wrap}
.sp-checks label{display:flex;align-items:center;gap:6px;min-width:auto;padding-top:0;text-transform:none;font-weight:500;color:var(--text);font-size:13px;cursor:pointer}
.sp-checks input{cursor:pointer;width:15px;height:15px}
.sp-save-row{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.sp-save{background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer}
.sp-save:hover{opacity:.9}
.events{display:none;padding:2px 14px 10px 46px;background:inherit}
.events.open{display:block}
.ev{font-size:12.5px;margin-bottom:6px;display:flex;align-items:flex-start;gap:7px;color:var(--text)}
.ev b{min-width:32px;color:var(--muted);font-weight:700}
.puck{width:8px;height:8px;border-radius:50%;background:#ff8c00;flex-shrink:0;margin-top:3px}
.wh{flex-shrink:0;margin-top:1px}
.empty{max-width:820px;margin:60px auto;text-align:center;color:var(--muted);font-size:15px}
footer{max-width:820px;margin:32px auto 0;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--accent)}

.menu-wrap{position:relative;flex-basis:100%;display:flex;justify-content:flex-end}
.menu-btn{display:flex;align-items:center;gap:6px;background:var(--text);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:13px;padding:0 12px;height:32px;border-radius:16px;cursor:pointer}
.menu-btn svg{flex-shrink:0}
.menu-list{display:none;position:absolute;right:0;top:38px;z-index:20;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);min-width:170px;overflow:hidden}
.menu-list.open{display:block}
.mgrp{padding:8px 16px 4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:#f6f6f6;border-top:1px solid var(--border)}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);font-family:inherit;font-size:15px;font-weight:600;padding:13px 16px;cursor:pointer;color:var(--text)}
.menu-list button:last-child{border-bottom:none}
.menu-list button.act{color:var(--accent);background:#fdf0f1}
.page-refresh{flex-basis:100%;text-align:right;padding-top:0}
.views{max-width:820px;margin:0 auto}
.vbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.vbar select{flex:1;min-width:0;padding:10px 10px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:15px;font-weight:700;background:#fff;color:var(--text)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;color:var(--text);font-family:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:16px;cursor:pointer}
.chip.act{background:var(--text);color:#fff;border-color:var(--text)}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden;margin-bottom:14px}
.card h3{margin:0;padding:12px 14px 4px;font-size:15px;font-weight:800}
.card .hint{padding:0 14px 8px;font-size:12px;color:var(--muted)}
.tr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);font-size:14px}
.tr:nth-child(even){background:var(--row-alt)}
.tr.head{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:6px 14px;background:none!important;border-top:none}
.tr .rk{width:22px;color:var(--muted);font-weight:700;flex-shrink:0;text-align:right}
.tr .nm{flex:1;min-width:0;font-weight:600}
.tr .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{display:block;font-size:11px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .n{white-space:nowrap;width:34px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.tr .n.w{width:62px}
.tr .n.b{font-weight:800}
.tr.cut{border-top:2px solid var(--accent)}
.tr.click{cursor:pointer}
.tr.click:hover{background:#f7e9ea}
.barbg{height:6px;background:#e6e6e6;border-radius:3px;margin-top:5px;overflow:hidden}
.barfg{height:100%;background:var(--accent);border-radius:3px}
.sub{padding:2px 14px 10px 44px;background:#fafafa;border-top:1px solid var(--border)}
.sub .tr{padding:7px 0;font-size:13px}
.more{display:block;width:calc(100% - 28px);margin:10px 14px 14px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--text)}
.note{padding:14px;color:var(--muted);font-size:13px;text-align:center}
.prog{height:6px;background:#e6e6e6;border-radius:3px;margin:8px 14px 12px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.gd{padding:8px 14px 2px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:#f0f0f0}
.gm{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);font-size:13.5px}
.gm .tm{width:42px;font-size:12px;color:var(--muted);flex-shrink:0}
.gm .tt{flex:1;min-width:0;font-weight:600}
.gm .tt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm .rs{font-weight:800;text-align:right;flex-shrink:0;color:var(--text);text-decoration:none}
</style>
</head>
<body>
<header>
  <div>
    <h1>Live Spiele</h1>
    <div class="subtitle" id="subtitle">Wird geladen …</div>
  </div>
  <div class="header-actions">
    <div class="menu-wrap">
      <button id="menuBtn" class="menu-btn" onclick="toggleMenu(event)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span id="menuLabel">Liveticker</span></button>
      <div id="menuList" class="menu-list"></div>
    </div>
    <button id="soundBtn" class="icon-btn" onclick="toggleSound()" title="Ton"></button>
    <button id="vibBtn" class="icon-btn" onclick="toggleVibration()" title="Vibration"></button>
    <button id="settingsBtn" class="icon-btn" onclick="toggleSettingsPanel()" title="Einstellungen"></button>
    <div class="page-refresh" id="pageRefresh"></div>
  </div>
</header>
<div class="wrap">
  <div id="soundPanel" class="sound-panel" style="display:none">
    <div class="sp-row">
      <label for="selClub">Verein</label>
      <select id="selClub" onchange="onClubChange()"></select>
    </div>
    <div class="sp-row sp-teams">
      <label>Teams</label>
      <div class="team-box">
        <div class="team-quick"><a onclick="selectAllTeams()">Alle</a><a onclick="selectNoTeams()">Keine</a></div>
        <div id="teamList" class="team-list"></div>
      </div>
    </div>
    <div class="sp-row sp-checks">
      <label><input type="checkbox" id="chkGoals" onchange="onEventToggle()"> Tore (Hupe)</label>
      <label><input type="checkbox" id="chkPenalties" onchange="onEventToggle()"> Strafen (Pfiff)</label>
      <label><input type="checkbox" id="chkEnd" onchange="onEventToggle()"> Spielende (Abpfiff)</label>
    </div>
    <div class="sp-save-row">
      <button class="sp-save" onclick="toggleSettingsPanel()">Speichern &amp; schliessen</button>
    </div>
  </div>
</div>
<div class="wrap" id="wrap"></div>
<div class="views" id="views" style="display:none"></div>

<footer>Daten: <a href="https://www.swiss-streethockey.ch" target="_blank" rel="noopener">Swiss Streethockey</a> · Aktualisiert sich automatisch alle 15 Sekunden<br>Anonyme Besucherstatistik ohne Cookies</footer>

<script>
(function(){
var WORKER = "https://crimson-shadow-9fa2.ch-nessier.workers.dev";

var LEAGUES = [
  {id:292,  type:"liga",     name:"National League"},
  {id:300,  type:"liga",     cup:true, name:"Swiss Cup"},

  {id:2110, type:"division", name:"U12 – Grossfeld"},
  {id:2111, type:"division", name:"U12 – Kleinfeld"},
  {id:2113, type:"division", name:"U9 – Region A"},
  {id:2112, type:"division", name:"U9 – Region B"}
];

var REFRESH_SECONDS = 15;

// Automatische Aktualisierung nur zwischen 08:30 und 22:30 Uhr (Schweizer Zeit).
// Der erste Seitenaufruf laedt immer, damit die Seite nie leer bleibt.
var UPDATE_START_MIN = 8 * 60 + 30;
var UPDATE_END_MIN = 22 * 60 + 30;
var firstLoadDone = false;
var dayLoaded = ""; // Datum (TT.MM.JJJJ) des letzten Ladens - fuer den Tageswechsel um 00:01
function zurichNow() {
  var h = 0, m = 0, d = "", mo = "", y = "";
  try {
    new Intl.DateTimeFormat("de-CH", { timeZone: "Europe/Zurich", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false })
      .formatToParts(new Date()).forEach(function(p) {
        if (p.type === "hour") h = parseInt(p.value, 10) % 24;
        if (p.type === "minute") m = parseInt(p.value, 10);
        if (p.type === "day") d = p.value;
        if (p.type === "month") mo = p.value;
        if (p.type === "year") y = p.value;
      });
  } catch (e) {
    var n = new Date(), pad = function(x) { return (x < 10 ? "0" : "") + x; };
    h = n.getHours(); m = n.getMinutes(); d = pad(n.getDate()); mo = pad(n.getMonth() + 1); y = String(n.getFullYear());
  }
  return { min: h * 60 + m, date: d + "." + mo + "." + y };
}
// Aktualisieren erlaubt: 08:30-22:30, ausserdem einmal pro Tag ab 00:01, um den
// heutigen Spielplan aller Ligen zu laden (Spiele erscheinen dann bis zum Start).
function updateAllowed() {
  var z = zurichNow();
  if (z.min >= UPDATE_START_MIN && z.min < UPDATE_END_MIN) return true;
  return dayLoaded !== z.date && z.min >= 1;
}

var CATEGORY_ORDER = ["National League","Challenge League","Damen","U18","U15","U12","U9"];

// ============================================================
// Benachrichtigungen: Verein + mehrere Teams waehlbar, pro Ereignistyp an/aus,
// Kanal Ton und/oder Vibration
// ============================================================
var soundEnabled = localStorage.getItem("ssha_snd_on") !== "0";
var vibrationEnabled = localStorage.getItem("ssha_snd_vib") === "1";
var selectedClub = localStorage.getItem("ssha_snd_club") || "kernenried";
var selectedTeams = []; // wird nach CLUBS-Aufbau befuellt (Liste voller Teamnamen)
var wantGoals = localStorage.getItem("ssha_snd_goals") !== "0";
var wantPenalties = localStorage.getItem("ssha_snd_penalties") !== "0";
var wantEnd = localStorage.getItem("ssha_snd_end") !== "0";
var audioCtx = null;
var prevGoals = {};
var prevPenalties = {};
var prevLiveIds = {};
var CLUBS = {}; // wird nach TEAM_CLUB befuellt: slug -> {label, teams:[...]}

var ICON_GEAR = '<svg viewBox="0 0 24 24" width="16" height="16"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.2"/></g><g fill="currentColor"><rect x="11" y="1.2" width="2" height="3.6" rx="1"/><rect x="11" y="19.2" width="2" height="3.6" rx="1"/><rect x="1.2" y="11" width="3.6" height="2" rx="1"/><rect x="19.2" y="11" width="3.6" height="2" rx="1"/><rect x="4.3" y="4" width="2" height="3.6" rx="1" transform="rotate(45 5.3 5.8)"/><rect x="17.7" y="4" width="2" height="3.6" rx="1" transform="rotate(-45 18.7 5.8)"/><rect x="4.3" y="16.4" width="2" height="3.6" rx="1" transform="rotate(-45 5.3 18.2)"/><rect x="17.7" y="16.4" width="2" height="3.6" rx="1" transform="rotate(45 18.7 18.2)"/></g></svg>';
var ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.2 6a8.6 8.6 0 010 12"/></svg>';
var ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
var ICON_VIB_ON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M3 9v6M1 10.5v3M21 9v6M23 10.5v3"/></svg>';
var ICON_VIB_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 3l16 18" stroke-width="1.6"/></svg>';

var CLUB_LABELS = {
  "fribourg-dragons":"SHC Fribourg Dragons",
  "horgenberg":"Horgenberg Hammers",
  "oberwil":"Oberwil Rebells",
  "aegerten-bruegg":"SHC Aegerten-Brügg",
  "belpa":"SHC Belpa 1107",
  "berner-oberland":"SHC Berner Oberland",
  "bettlach":"SHC Bettlach",
  "bonstetten-wettswil":"SHC Bonstetten-Wettswil",
  "kernenried":"SHC Bulldozers Kernenried-Zauggenried",
  "diabla":"SHC Diabla / Valais",
  "erlinsbach":"SHC Erlinsbach",
  "grenchen-limpachtal":"SHC Grenchen-Limpachtal",
  "la-chaux-de-fonds":"SHC La Chaux-de-Fonds",
  "langenthal-devils":"SHC Langenthal Devils",
  "martigny":"SHC Martigny",
  "seetal-admirals":"SHC Seetal Admirals",
  "steckholz":"SHC Steckholz",
  "wild-sharks":"SHC Wild Sharks",
  "sierre":"Sierre Lions",
  "gals":"SV Gals"
};

function updateSoundButton() {
  var btn = document.getElementById("soundBtn");
  if (!btn) return;
  btn.innerHTML = soundEnabled ? ICON_SOUND_ON : ICON_SOUND_OFF;
  btn.classList.toggle("on", soundEnabled);
  btn.title = soundEnabled ? "Ton ausschalten" : "Ton einschalten";
}

function updateVibButton() {
  var btn = document.getElementById("vibBtn");
  if (!btn) return;
  var supported = "vibrate" in navigator;
  btn.innerHTML = vibrationEnabled ? ICON_VIB_ON : ICON_VIB_OFF;
  btn.classList.toggle("on", vibrationEnabled && supported);
  if (!supported) {
    btn.disabled = true;
    btn.classList.add("unsupported");
    btn.title = "Vibration wird von diesem Gerät/Browser nicht unterstützt (z.B. iPhone/Safari kennt keine Vibration im Web)";
  } else {
    btn.disabled = false;
    btn.classList.remove("unsupported");
    btn.title = vibrationEnabled ? "Vibration ausschalten" : "Vibration einschalten";
  }
}

function doVibrate(pattern) {
  if (vibrationEnabled && "vibrate" in navigator) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}

// Generischer Ton-Baustein: type = "sine"/"square"/"sawtooth" usw.
function playTone(type, freq, startOffset, dauer, vol) {
  var ctx = initAudio();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(ctx.destination);
  var t = ctx.currentTime + startOffset;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.linearRampToValueAtTime(0, t + dauer);
  osc.start(t);
  osc.stop(t + dauer + 0.05);
}

// Versucht den AudioContext zu "wecken": iOS/Safari suspendiert ihn automatisch,
// sobald die Seite in den Hintergrund geht; ohne erneutes resume() bliebe er stumm.
function resumeAudioIfNeeded() {
  var ctx = initAudio();
  if (ctx && ctx.state === "suspended") {
    try { ctx.resume(); } catch (e) {}
  }
  return ctx;
}

// Tor = Hupe (zwei leicht dissonante Sägezahn-Töne, wie ein Autohorn)
function fireGoal(anzahl) {
  if (!wantGoals) return;
  resumeAudioIfNeeded();
  if (soundEnabled && audioCtx) {
    var n = Math.min(anzahl, 3);
    for (var i = 0; i < n; i++) {
      var t = i * 0.55;
      playTone("sawtooth", 300, t, 0.42, 0.22);
      playTone("sawtooth", 377, t, 0.42, 0.16);
    }
  }
  doVibrate([180, 90, 180, 90, 180]);
}

// Strafe = einzelner kurzer Schiedsrichterpfiff
function firePenalty(anzahl) {
  if (!wantPenalties) return;
  resumeAudioIfNeeded();
  if (soundEnabled && audioCtx) {
    var n = Math.min(anzahl, 3);
    for (var i = 0; i < n; i++) {
      playTone("square", 2200, i * 0.45, 0.28, 0.18);
    }
  }
  doVibrate([150]);
}

// Spielende = Abpfiff im Fussball-Stil: kurz - kurz - lang
function fireEnd() {
  if (!wantEnd) return;
  resumeAudioIfNeeded();
  if (soundEnabled && audioCtx) {
    playTone("square", 2200, 0, 0.16, 0.2);
    playTone("square", 2200, 0.26, 0.16, 0.2);
    playTone("square", 2200, 0.52, 0.55, 0.22);
  }
  doVibrate([120, 90, 120, 90, 320]);
}

function matchesSelection(teamName) {
  if (!teamName) return false;
  if (clubSlugFor(teamName) !== selectedClub) return false;
  return selectedTeams.indexOf(teamName) !== -1;
}

function resetEventTracking() {
  prevGoals = {};
  prevPenalties = {};
  prevLiveIds = {};
}

// Prueft alle Spiele des gewaehlten Vereins/Teams auf NEUE Tore (beider Teams),
// NEUE Strafen (beider Teams) und auf ein soeben beendetes Spiel - und spielt
// bei Bedarf das jeweilige Signal.
function checkOwnEvents(games) {
  var currentLiveIds = {};
  games.forEach(function(g) {
    if (g.status !== "live") return;
    var home = text(g.doc, "spielheimTeamShort");
    var away = text(g.doc, "spielgastTeamShort");
    if (!matchesSelection(home) && !matchesSelection(away)) return;
    var spielnr = text(g.doc, "spielnr");
    currentLiveIds[spielnr] = true;
    var goalCnt = 0, penCnt = 0;
    Array.prototype.slice.call(g.doc.getElementsByTagName("message")).forEach(function(m) {
      var e = parseEvent(text(m, "text"));
      // Tore beider Teams zaehlen - Hupe ertoent bei jedem Tor im Spiel des gewaehlten Vereins/Teams
      if (e.type === "goal") goalCnt++;
      if (e.type === "penalty") penCnt++;
    });
    var prevG = prevGoals[spielnr];
    if (prevG !== undefined && goalCnt > prevG) fireGoal(goalCnt - prevG);
    prevGoals[spielnr] = goalCnt;
    var prevP = prevPenalties[spielnr];
    if (prevP !== undefined && penCnt > prevP) firePenalty(penCnt - prevP);
    prevPenalties[spielnr] = penCnt;
  });
  Object.keys(prevLiveIds).forEach(function(nr) {
    if (!currentLiveIds[nr]) fireEnd();
  });
  prevLiveIds = currentLiveIds;
}

function fetchXml(url) {

  }).then(function(t) {

}

var failedLeagues = 0; // Ligen, deren Spielplan nicht geladen werden konnte

// Saison-ID aendert sich praktisch nie: pro Tag nur einmal abfragen
// (spart eine Worker-Anfrage bei jeder 15-s-Aktualisierung).
var seasonCache = { id: "", day: "" };
function getSeasonIdCached() {
  var day = zurichNow().date;
  if (seasonCache.id && seasonCache.day === day) return Promise.resolve(seasonCache.id);
  return getCurrentSeasonId().then(function(id) {
    if (id) seasonCache = { id: id, day: day };
    return id;
  }).catch(function() { return seasonCache.id; });
}

// Spielplan aller 15 Ligen nur alle 5 Minuten (und bei Tageswechsel) laden statt alle
// 15 Sekunden - das waere der groesste Posten im Gratis-Limit von 100'000 Worker-Anfragen/Tag.
// Alle 15 s werden nur noch die Ticker der laufenden Spiele abgefragt.
var candCache = { list: null, at: 0, day: "" };
var CAND_TTL_MS = 5 * 60 * 1000;
function findCandidatesCached() {
  var day = zurichNow().date, now = Date.now();
  if (candCache.list && candCache.day === day && now - candCache.at < CAND_TTL_MS) return Promise.resolve(candCache.list);
  return findCandidates().then(function(list) {
    // Bei Teilfehlern (Liga nicht ladbar) schon nach ~60 s erneut versuchen
    candCache = { list: list, at: failedLeagues ? now - CAND_TTL_MS + 60000 : now, day: day };
    return list;
  });
}

function findCandidates() {
  var today = todayGerman();
  failedLeagues = 0;
  return Promise.all(LEAGUES.map(function(league) {
    // list=all statt list=open: so bleiben auch soeben beendete Spiele
    // (die evtl. schon als "gespielt" markiert sind) in der Liste,
    // damit wir sie noch bis 1 Std. nach Spielende zeigen können.
    var url = WORKER + "/?path=xml/spielplan.aspx&id=" + league.id + "&typ=" + league.type + "&list=all";
    return fetchXml(url).then(function(doc) {
      return Array.prototype.slice.call(doc.getElementsByTagName("Spiel"))
        .filter(function(spiel) {
          return text(spiel, "datum").indexOf(today) === 0; // ALLE Spiele des Tages, auch ohne Liveticker
        })
        .map(function(spiel) {
          return {
            spielnr: text(spiel, "spielnr"),
            league: league,
            heim: text(spiel, "heim"),
            gast: text(spiel, "gast"),
            datumZeit: text(spiel, "datum"),
            ort: text(spiel, "spielort"),
            ticker: text(spiel, "livetickeron") === "1",
            gespielt: text(spiel, "gespielt") === "1",
            resultat: text(spiel, "resultat")
          };
        });
    }).catch(function() { failedLeagues++; return []; });
  })).then(function(lists) {
    return [].concat.apply([], lists);
  });
}

// Wandelt "DD.MM.YYYY HH:MM:SS" in ein vergleichbares Date-Objekt um.
function parseCandidateKickoff(candidate) {
  var parts = (candidate.datumZeit || "").split(" ");
  var datum = (parts[0] || "").split(".");
  var zeit = (parts[1] || "0:0:0").split(":");
  if (datum.length < 3) return null;
  return new Date(+datum[2], +datum[1] - 1, +datum[0], +zeit[0] || 0, +zeit[1] || 0, +zeit[2] || 0);
}

function scheduledGameFromCandidate(candidate, seasonId) {
  return {
    candidate: candidate,
    league: candidate.league,
    seasonId: seasonId,
    status: "scheduled"
  };
}

// Beendete Spiele aendern sich nicht mehr: einmal geladen, nicht mehr neu abrufen.
var finishedCache = {};
var TICKER_VORLAUF_MS = 20 * 60 * 1000; // Ticker erst ab 20 Min. vor Anspielzeit abfragen

function checkLive(candidate, seasonId) {
  // Spiele ohne Liveticker (z.B. viele Junioren-Turniere): nur Spielplan-Daten
  if (!candidate.ticker) {
    if (candidate.gespielt) return Promise.resolve({ candidate: candidate, league: candidate.league, seasonId: seasonId, status: "result" });
    return Promise.resolve(scheduledGameFromCandidate(candidate, seasonId));
  }
  if (finishedCache[candidate.spielnr]) return Promise.resolve(finishedCache[candidate.spielnr]);
  // Spiel liegt noch weit in der Zukunft: kein Ticker-Abruf noetig
  var ko = parseCandidateKickoff(candidate);
  if (!candidate.gespielt && ko && ko.getTime() - Date.now() > TICKER_VORLAUF_MS) {
    return Promise.resolve(scheduledGameFromCandidate(candidate, seasonId));
  }
  var url = WORKER + "/?path=xml/liveticker.aspx&spielnr=" + candidate.spielnr + "&saisonid=" + seasonId + "&_=" + Date.now();
  return fetchXml(url).then(function(doc) {
    var started = text(doc, "spielbeginn");
    var ended = text(doc, "spielende");
    if (!started) {
      // Spielplan sagt "gespielt", Ticker leer: Resultat aus dem Spielplan zeigen
      if (candidate.gespielt) return { candidate: candidate, league: candidate.league, seasonId: seasonId, status: "result" };
      return scheduledGameFromCandidate(candidate, seasonId); // noch nicht begonnen
    }
    if (!ended) {
      return { doc: doc, candidate: candidate, league: candidate.league, seasonId: seasonId, status: "live" };
    }
    var g = { doc: doc, candidate: candidate, league: candidate.league, seasonId: seasonId, status: "finished" };
    finishedCache[candidate.spielnr] = g; // beendete Spiele bleiben den ganzen Tag sichtbar
    return g;
  }).catch(function() {
    if (candidate.gespielt) return { candidate: candidate, league: candidate.league, seasonId: seasonId, status: "result" };
    return scheduledGameFromCandidate(candidate, seasonId);
  });
}

function parseEvent(rawText) {
  var goalMatch = rawText.match(/^Tor für (.+?) durch (.+?)(?: auf Pass von (.+?))?\.\s*Neuer Spielstand (\d+:\d+)/);
  if (goalMatch) {
    return { type: "goal", team: goalMatch[1], scorer: goalMatch[2], assists: goalMatch[3], score: goalMatch[4] };
  }
  var penaltyMatch1 = rawText.match(/^(\d+)\s*Minutenstrafe für (.+?)\s*\((.+?)\)/);
  if (penaltyMatch1) {
    return { type: "penalty", minutes: penaltyMatch1[1] + " Min.", player: penaltyMatch1[2], team: penaltyMatch1[3] };
  }
  var penaltyMatch2 = rawText.match(/^Bankstrafen? gegen (.+?)\.\s*Die Strafe wird abgesessen von (.+)/);
  if (penaltyMatch2) {
    return { type: "penalty", minutes: "", player: penaltyMatch2[2], team: penaltyMatch2[1] };
  }
  return { type: "other", text: rawText };
}

function renderEvent(time, rawText) {
  var e = parseEvent(rawText);
  if (e.type === "goal") {
    var sub = e.scorer + (e.assists ? " – " + e.assists.replace(" und ", " / ") : "");
    return '<div class="ev"><b>' + time + '</b><span class="puck"></span><div>' + e.score + ' ' + e.team + '<div style="font-size:10.5px;color:var(--muted);margin-top:1px">' + sub + '</div></div></div>';
  }
  if (e.type === "penalty") {
    return '<div class="ev"><b>' + time + '</b>' + WHISTLE + '<div>' + e.team + (e.minutes ? ' · ' + e.minutes : '') + ' / ' + e.player + '</div></div>';
  }
  return '<div class="ev"><b>' + time + '</b><div>' + rawText + '</div></div>';
}

function categoryFor(leagueName) {
  if (leagueName.indexOf("Classic League") !== -1) return "Classic League";
  var base = leagueName.split(" – ")[0];
  return base;
}
function categoryOrderIndex(category) {
  var idx = CATEGORY_ORDER.indexOf(category);
  if (idx !== -1) return idx;
  if (category === "Classic League") return 999;
  return CATEGORY_ORDER.length;
}

// Zaehlt die Tore direkt aus den Ticker-Meldungen zusammen (statt das
// separate Zahlen-Feld von SSHA zu uebernehmen, das gelegentlich schon
// aktualisiert ist, bevor die zugehoerige Tor-Meldung eingetragen wurde).
function zaehleTore(allMessages, home, away) {
  // Spielstand aus der neuesten Tor-Meldung ("Neuer Spielstand X:Y") uebernehmen.
  // Der Abgleich ueber Teamnamen war fehleranfaellig: SSHA fuehrt teils abweichende
  // Kurznamen (z.B. "U15C" statt "U12"), dann wurden Tore nicht zugeordnet.
  var best = null, bestSum = -1;
  allMessages.forEach(function(m) {
    var e = parseEvent(text(m, "text"));
    if (e.type !== "goal" || !e.score) return;
    var p = e.score.split(":");
    var h = parseInt(p[0], 10), a = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(a)) return;
    if (h + a > bestSum) { bestSum = h + a; best = { home: h, away: a }; }
  });
  return best || { home: 0, away: 0 };
}

// Haelt gemerkt, welche "Ereignisse"-Panels der Nutzer von Hand geoeffnet hat.
// Bleibt ueber den 15s-Refresh hinweg bestehen (wird nicht pro render zurueckgesetzt)
// und schliesst sich nur noch, wenn der Nutzer selbst draufklickt.
var openEvents = {};

window.toggleEvents = function(uid) {
  var e = document.getElementById(uid);
  if (!e) return;
  var nowOpen = !e.classList.contains("open");
  e.classList.toggle("open", nowOpen);
  openEvents[uid] = nowOpen;
  var btn = e.previousElementSibling ? e.previousElementSibling.querySelector(".toggle") : null;
  if (btn) btn.textContent = nowOpen ? "Verbergen" : "Ereignisse";
};

function kickoffZeit(candidate) {
  var d = parseCandidateKickoff(candidate);
  if (!d) return "";
  var pad = function(n) { return (n < 10 ? "0" : "") + n; };
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function renderScheduledRow(game) {
  var c = game.candidate || {};
  var home = c.heim || "";
  var away = c.gast || "";
  var scoreHtml, infoParts = [];
  if (game.status === "result") {
    var p = (c.resultat || "").split(":");
    var hs = (p[0] || "").trim(), as = (p[1] || "").trim();
    if (!hs && !as) { hs = "–"; as = "–"; }
    scoreHtml = '<span class="res">' + hs + '</span><span class="res">' + as + '</span>';
    infoParts.push("Endresultat");
  } else {
    scoreHtml = '<span class="res sched">' + kickoffZeit(c) + '</span>';
    if (!c.ticker) infoParts.push("Kein Liveticker");
  }
  if (c.ort) infoParts.push(c.ort);
  return '<div class="game">' +
    '<div class="game-row">' +
    '<div class="teams-col">' +
      '<div class="team-line">' + renderAvatar(home) + '<span>' + home + '</span></div>' +
      '<div class="team-line">' + renderAvatar(away) + '<span>' + away + '</span></div>' +
    '</div>' +
    '<div class="score-col">' +
      scoreHtml +
      '<div class="game-time">' + infoParts.join(" · ") + '</div>' +
    '</div>' +
    '</div>' +
    '</div>';
}

function renderGameRow(game) {
  if (!game.doc) return renderScheduledRow(game); // scheduled oder result (ohne Ticker-Daten)

  var d = game.doc;
  var home = text(d, "spielheimTeamShort");
  var away = text(d, "spielgastTeamShort");
  var allMessages = Array.prototype.slice.call(d.getElementsByTagName("message")).reverse();
  var eventsHtml = allMessages.map(function(m) { return renderEvent(text(m, "spielzeit"), text(m, "text")); }).join("") || "<p style='color:var(--muted);font-size:12px'>Noch keine Ereignisse.</p>";
  var detailUrl = isDemo
    ? "spiel.html?demo=1"
    : "spiel.html?spielnr=" + text(d, "spielnr") + "&saisonid=" + game.seasonId;
  var uid = "ev" + text(d, "spielnr");
  var isOpen = !!openEvents[uid];
  var updated = text(d, "last_updated").split(" ")[1] || "";
  var tore = zaehleTore(allMessages, home, away);

  // Grün blinkt nur, wenn dieses Spiel (global über alle Ligen/Spiele hinweg)
  // das zeitlich neueste Tor hat - siehe Berechnung in renderGrouped()
  var dotHtml = "";
  if (game.status === "live") {
    var dotClass = "dot" + (game._istNeuestesTor ? " goal" : "");
    dotHtml = '<span class="' + dotClass + '"></span>';
  }

  return '<div class="game">' +
    '<div class="game-row">' +
    dotHtml +
    '<div class="teams-col">' +
      '<div class="team-line">' + renderAvatar(home) + '<span>' + home + '</span></div>' +
      '<div class="team-line">' + renderAvatar(away) + '<span>' + away + '</span></div>' +
    '</div>' +
    '<div class="score-col">' +
      '<a class="res" href="' + detailUrl + '">' + tore.home + '</a>' +
      '<a class="res" href="' + detailUrl + '">' + tore.away + '</a>' +
      '<div class="game-time">Update: ' + updated + '</div>' +
    '</div>' +
    '<button class="toggle" onclick="toggleEvents(\'' + uid + '\')">' + (isOpen ? "Verbergen" : "Ereignisse") + '</button>' +
    '</div>' +
    '<div class="events' + (isOpen ? " open" : "") + '" id="' + uid + '">' + eventsHtml + '</div>' +
    '</div>';
}

function parseUpdateTime(lastUpdated) {
  // Format: "06.09.2026 14:25:46" -> vergleichbarer Zeitwert
  var parts = lastUpdated.split(" ");
  var datum = (parts[0] || "").split(".");
  var zeit = (parts[1] || "0:0:0").split(":");
  return new Date(+datum[2], +datum[1] - 1, +datum[0], +zeit[0], +zeit[1], +zeit[2] || 0).getTime();
}

// Fuer die Sortierung innerhalb einer Liga-Sektion: Anstoss-/Update-Zeitpunkt,
// unabhaengig vom Status (laufend/beendet/angesetzt).
function gameSortTime(g) {
  if (g.candidate) {
    var d = parseCandidateKickoff(g.candidate);
    if (d) return d.getTime();
  }
  return g.doc ? parseUpdateTime(text(g.doc, "last_updated")) : 0;
}

function renderGrouped(games) {
  // Über ALLE Spiele hinweg ermitteln, wo zuletzt ein Tor gefallen ist.
  // Nur das/die Spiel(e) mit dem zeitlich neuesten Tor blinken grün.
  var maxGoalTime = -1;
  games.forEach(function(g) {
    if (g.status !== "live") return;
    var msgs = Array.prototype.slice.call(g.doc.getElementsByTagName("message")).reverse();
    var letztesIstTor = msgs.length > 0 && parseEvent(text(msgs[0], "text")).type === "goal";
    g._letztesIstTor = letztesIstTor;
    g._updateTime = parseUpdateTime(text(g.doc, "last_updated"));
    if (letztesIstTor && g._updateTime > maxGoalTime) maxGoalTime = g._updateTime;
  });
  games.forEach(function(g) {
    g._istNeuestesTor = g._letztesIstTor && g._updateTime === maxGoalTime && maxGoalTime > -1;
  });

  var byCategory = {};
  games.forEach(function(g) {
    var cat = categoryFor(g.league.name);
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(g);
  });
  var categories = Object.keys(byCategory).sort(function(a, b) {
    return categoryOrderIndex(a) - categoryOrderIndex(b);
  });
  var hatLiveSpiel = games.some(function(g) { return g.status === "live"; });
  wrap.innerHTML = (hatLiveSpiel ? '<div class="live-badge">Live</div>' : "") + categories.map(function(cat) {
    var liste = byCategory[cat].slice().sort(function(a, b) { return gameSortTime(a) - gameSortTime(b); });
    return '<div class="league-section">' +
      '<div class="league-title">' + cat + ' <span class="chev">›</span></div>' +
      '<div class="games">' + liste.map(renderGameRow).join("") + '</div>' +
      '</div>';
  }).join("");

  // Panels fuer Spiele, die nicht mehr angezeigt werden, nicht endlos mitschleppen
  var aktiveIds = {};
  games.forEach(function(g) { if (g.doc) aktiveIds["ev" + text(g.doc, "spielnr")] = true; });
  Object.keys(openEvents).forEach(function(uid) { if (!aktiveIds[uid]) delete openEvents[uid]; });
}

function run() {
  if (window.__view && window.__view !== "ticker") return; // andere Ansicht aktiv: kein Ticker-Abruf
  if (new URLSearchParams(location.search).get("demo")) {
    runDemo();
    return;
  }
  if (firstLoadDone && !updateAllowed()) return; // ausserhalb 08:30-22:30 nur Tageswechsel-Laden ab 00:01
  firstLoadDone = true;
  dayLoaded = zurichNow().date;
  getSeasonIdCached().then(function(seasonId) {
    if (!seasonId) {
      subtitle.textContent = "Saison konnte nicht ermittelt werden.";
      return;
    }
    findCandidatesCached().then(function(candidates) {
      if (!candidates.length) {
        checkOwnEvents([]);
        subtitle.textContent = failedLeagues ? "Spielplan konnte nicht vollständig geladen werden." : "Heute sind keine Spiele angesetzt.";
        wrap.innerHTML = "";
        markPageRefreshed();
        return;
      }
      Promise.all(candidates.map(function(c) { return checkLive(c, seasonId); })).then(function(results) {
        var games = results.filter(function(g) { return g; });
        if (!games.length) {
          checkOwnEvents([]);
          subtitle.textContent = "Heute sind keine Spiele angesetzt.";
          wrap.innerHTML = "";
          markPageRefreshed();
          return;
        }
        checkOwnEvents(games);
        var liveCount = games.filter(function(g) { return g.status === "live"; }).length;
        var finishedCount = games.filter(function(g) { return g.status === "finished" || g.status === "result"; }).length;
        var scheduledCount = games.filter(function(g) { return g.status === "scheduled"; }).length;
        var teile = [];
        if (liveCount > 0) teile.push(liveCount + " Spiel" + (liveCount > 1 ? "e" : "") + " laufen gerade");
        if (scheduledCount > 0) teile.push(scheduledCount + " noch angesetzt");
        if (finishedCount > 0) teile.push(finishedCount + " beendet");
        var txt = teile.join(" · ") || "Heute sind keine Spiele angesetzt.";
        if (failedLeagues) txt += " (" + failedLeagues + " Liga" + (failedLeagues > 1 ? "en" : "") + " nicht ladbar)";
        subtitle.textContent = txt;
        renderGrouped(games);
        markPageRefreshed();
      });
    });
  });
}

function makeDemoXml(cfg) {

}

<script>
(function(){

];

try { var sv = parseInt(localStorage.getItem("viewLeague"), 10); if (sv >= 0 && sv < LEAGUES.length) state.league = sv; } catch (e) {}

var menuBtn = document.getElementById("menuBtn"), menuList = document.getElementById("menuList");

function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function num(s) { var n = parseFloat(String(s).replace(",", ".")); return isNaN(n) ? 0 : n; }

function lg(l) { return "id=" + l.id + "&typ=" + l.type; }

// ---------- Menue ----------

// ---------- Liveticker + : Zugangscode (liveticker-plus.json im Repo) ----------
var unlocked = false;
function sha256hex(str) {
  if (!(window.crypto && crypto.subtle)) return Promise.resolve("");
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(b) {
    return Array.prototype.map.call(new Uint8Array(b), function(x) { return ("0" + x.toString(16)).slice(-2); }).join("");
  });
}
function codeMatches(entered) {
  entered = String(entered || "").trim();
  if (!entered) return Promise.resolve(false);
  return fetch("liveticker-plus.json?t=" + Date.now(), {cache: "no-store"}).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(j) {
    var c = String(j && j.code != null ? j.code : "").trim();
    if (!c) return false;
    if (/^[0-9a-f]{64}$/i.test(c)) return sha256hex(entered).then(function(h) { return h === c.toLowerCase(); });
    return entered === c;

function storedCode() { try { return localStorage.getItem("lpCode") || ""; } catch (e) { return ""; } }

function showCodeForm(err) {

    if (dur > 0 && (c === "A" || c === "B" || c === "C")) pens.push({h: p[0], st: p[1], en: p[1] + dur * 60, minor: dur <= 2 && c !== "C"});

  function short(side, t) { var n = 0; pens.forEach(function(p) { if (p.h === side && p.st < t && t < p.en) n++; }); return Math.min(n, 2); }
  goals.forEach(function(go) {

    if (so > ss) {

}

function progUI(title, n) {
  return '<div class="card"><h3>' + title + '</h3><div class="hint" id="progTxt">Spielberichte 0 / ' + n + '</div><div class="prog"><div id="progBar"></div></div></div>';
}
function progCb(my) {
  return function(d, n) {
    if (my !== token) return;
    var t = document.getElementById("progTxt"), b = document.getElementById("progBar");
    if (t) t.textContent = "Spielberichte " + d + " / " + n;
    if (b) b.style.width = Math.round(d / n * 100) + "%";
  };
}
function withMatches(done, my, title, cb) {
  var l = league();
  Promise.all([loadSpielplan(), A.season()]).then(function(r) {
    var games = r[0].filter(function(g) { return g.done; });
    if (!games.length) return done('<div class="card"><div class="note">Noch keine gespielten Spiele.</div></div>');
    var c = lgData[state.league];
    if (!(c && Date.now() - c.when < 30 * 60 * 1000 && c.n === games.length)) done(progUI(title, games.length));
    loadLeagueMatches(state.league, r[1], games, progCb(my)).then(function(d) {
      if (my !== token) return;
      cb(d);
    });
  }).catch(function() { done(errBox()); });
}
function vStatistik(done, my) {
  var head = '<div class="chips" id="statTabs"><button class="chip" data-s="pp" onclick="stSubSet(\'pp\')">\u00dcberzahl-Tore</button><button class="chip" data-s="prod" onclick="stSubSet(\'prod\')">Produktivit\u00e4t</button><button class="chip" data-s="sh" onclick="stSubSet(\'sh\')">Unterzahl</button></div><div id="statBody"></div>';
  withMatches(done, my, "Statistik wird berechnet \u2026", function(d) {
    curStats = computeStats(d); viewsEl.innerHTML = leagueBar() + head; renderStatBody();
  });
}

// ---------- Strafen pro Spiel / Gegner ----------
window.pgTeam = function(v) { state.pgTeam = v; render(); };
function strafenPerGame(done, my) {
  withMatches(function(h) { done(subChips() + h); }, my, "Strafen werden geladen \u2026", function(d) {
    var names = {};
    d.games.forEach(function(g) { names[g.heim] = 1; names[g.gast] = 1; });
    var list = Object.keys(names).sort();
    if (!state.pgTeam || !names[state.pgTeam]) state.pgTeam = list[0];
    var team = state.pgTeam;
    var h = subChips() + '<div class="vbar"><select onchange="pgTeam(this.value)">' + list.map(function(n) { return "<option" + (n === team ? " selected" : "") + ' value="' + esc(n) + '">' + esc(n) + "</option>"; }).join("") + "</select></div>";
    var gs = d.games.filter(function(g) { return g.heim === team || g.gast === team; }).sort(function(a, b) { return b.ts - a.ts; });
    var totN = 0, totM = 0, rows = "";
    gs.forEach(function(g) {
      var m = d.matches[g.nr]; if (!m) return;
      var isH = g.heim === team, opp = isH ? g.gast : g.heim;
      var mine = m.s.filter(function(p) { return p[0] === isH; });
      var min = 0, pl = {};
      mine.forEach(function(p) { min += p[2]; var n = p[4] || "?"; pl[n] = (pl[n] || 0) + 1; });
      totN += mine.length; totM += min;
      var top = Object.keys(pl).map(function(n) { return [n, pl[n]]; }).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 3);
      rows += '<div class="gm" style="flex-wrap:wrap"><span class="tm">' + esc(g.day.slice(0, 5)) + '</span><span class="tt"><span>' + (isH ? "vs " : "@ ") + esc(opp) + '</span></span><span class="rs">' + mine.length + " Str. \u00b7 " + min + " min</span>" +
        '<div style="flex-basis:100%;padding-left:52px;font-size:12px;color:var(--muted)">' + (top.length ? top.map(function(t) { return esc(t[0]) + (t[1] > 1 ? " (" + t[1] + "\u00d7)" : ""); }).join(" \u00b7 ") : "Keine Strafen") + "</div></div>";
    });
    h += '<div class="card"><h3>Strafen pro Spiel</h3><div class="hint">Insgesamt ' + totN + " Strafen, " + totM + " min in " + gs.length + ' Spielen. Darunter die bis zu 3 Spieler mit den meisten Strafen im Spiel. Alle Strafen z\u00e4hlen mit.</div>' + rows + "</div>";
    done(h);
  });
}
function subChips() {
  return '<div class="chips"><button class="chip' + (state.strSub !== "game" ? " act" : "") + '" onclick="strSub(\'tab\')">Teams &amp; Spieler</button><button class="chip' + (state.strSub === "game" ? " act" : "") + '" onclick="strSub(\'game\')">Pro Spiel &amp; Gegner</button></div>';
}
window.strSub = function(v) { state.strSub = v; render(); };
window.__stats = {analyzeGame: analyzeGame, parseMatch: parseMatch};
})();
</script>
