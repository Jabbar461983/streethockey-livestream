<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spieldetails – Swiss Streethockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --border:#e2e2e2;
  --text:#1a1a1a;
  --muted:#6b6b6b;
  --accent:#e3000f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:24px 16px 60px;
}
.wrap{max-width:760px;margin:0 auto}
.back{
  display:inline-block;color:var(--text);text-decoration:none;font-size:14px;margin-bottom:20px;
  background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:8px;
  font-weight:600;
}
.back:hover{border-color:var(--accent);color:var(--accent)}
.error-detail{
  font-size:12px;color:var(--muted);margin-top:10px;word-break:break-all;
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
}
.error-detail a{color:var(--accent)}
.status{color:var(--muted);font-style:italic}
.error{color:#b8860b}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{
  background:var(--card);border:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:20px;cursor:pointer;
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}
.panel.active{display:block}
.meta-top{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.3px}
.top{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.status-label{font-weight:800;letter-spacing:1px;font-size:13px;color:var(--accent);text-transform:uppercase}
.score-card{background:#3a3a3a;color:#fff;border-radius:10px;padding:14px 20px;max-width:200px;margin:0 auto 18px;text-align:center;font-size:30px;font-weight:800}
.score-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:6px}
.team-block{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.avatar-wrap{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;background:#eee}
.avatar-wrap img{width:100%;height:100%;object-fit:contain;display:none}
.avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.team{font-weight:700;font-size:16px;text-align:center;flex:1}
.meta{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 22px}
h2{
  font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--text);border-bottom:2px solid var(--border);padding-bottom:6px;margin:20px 0 12px;
}
.ev{background:var(--card);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ev b{min-width:40px;color:var(--muted);font-weight:700}
.puck{width:13px;height:9px;border-radius:50%;background:#1a1a1a;flex-shrink:0;margin-top:4px}
.wh{flex-shrink:0;margin-top:2px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.lineups{display:flex;gap:28px;flex-wrap:wrap}
.col{flex:1;min-width:230px;background:var(--card);border-radius:8px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 5px}
.subhead:first-child{margin-top:0}
.player{font-size:14px;margin-bottom:3px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Zurück zur Übersicht</a>
  <div id="content"><p class="status">Spiel wird geladen …</p></div>
</div>

<script>
(function(){
var WORKER = "https://crimson-shadow-9fa2.ch-nessier.workers.dev";
var params = new URLSearchParams(location.search);
var spielnr = params.get("spielnr");
var seasonId = params.get("saisonid");
var content = document.getElementById("content");

var WHISTLE = '<svg class="wh" width="15" height="15" viewBox="0 0 24 24"><circle cx="8" cy="12" r="6" fill="none" stroke="#1a1a1a" stroke-width="2"/><circle cx="8" cy="12" r="2" fill="#1a1a1a"/><rect x="13" y="10" width="8" height="4" rx="2" fill="#1a1a1a"/></svg>';

// Verein pro Team-Name (für Logo-Dateinamen: logos/<VEREIN>.png)
// Alle Mannschaften desselben Vereins (1., 2., Damen, U18, U15, U12, U9 ...)
// nutzen automatisch dieselbe Logo-Datei.
var TEAM_CLUB = {
  "SHC Fribourg Dragons":"fribourg-dragons",
  "Horgenberg Hammers 1":"horgenberg","Horgenberg Hammers 2":"horgenberg","Horgenberg Hammers Damen":"horgenberg",
  "Horgenberg Hammers U18":"horgenberg","Horgenberg Hämmerlis U9":"horgenberg","Horgenberg Hammers U15":"horgenberg","Horgenberg Hammers U12":"horgenberg",
  "Oberwil Rebells 1":"oberwil","Oberwil Rebells 2":"oberwil","Oberwil Rebells U18":"oberwil",
  "Oberwil Rebells U15":"oberwil","Oberwil Rebells U12":"oberwil","Oberwil Rebells U9":"oberwil",
  "SHC Aegerten-Brügg 1":"aegerten-bruegg","SHC Aegerten-Brügg U15":"aegerten-bruegg","SHC Aegerten-Brügg U12":"aegerten-bruegg","SHC Aegerten-Brügg U9":"aegerten-bruegg",
  "SHC Belpa 1107 1":"belpa","SHC Belpa 1107 2":"belpa","SHC Belpa 1107 Damen":"belpa","SHC Belpa 1107 U18":"belpa","SHC Belpa 1107 U15":"belpa",
  "SHC Berner Oberland 1":"berner-oberland",
  "SHC Bettlach 1":"bettlach","SHC Bettlach 2":"bettlach","SHC Bettlach - Seetal Damen":"bettlach",
  "SHC Bettlach U18":"bettlach","SHC Bettlach U15":"bettlach","SHC Bettlach U12":"bettlach","SHC Bettlach U9":"bettlach",
  "SHC Bonstetten-Wettswil 1":"bonstetten-wettswil","SHC Bonstetten-Wettswil 2":"bonstetten-wettswil","SHC Bonstetten-Wettswil U18":"bonstetten-wettswil",
  "SHC Bonstetten-Wettswil U9":"bonstetten-wettswil","SHC Bonstetten-Wettswil U12":"bonstetten-wettswil","SHC Bonstetten-Wettswil U15":"bonstetten-wettswil",
  "SHC Bulldozers Kernenried-Zauggenried 1":"kernenried","SHC Bulldozers Kernenried-Zauggenried 2":"kernenried",
  "SHC Bulldozers Kernenried-Zauggenried Damen":"kernenried","SHC Bulldozers Kernenried-Zauggenried U18":"kernenried",
  "SHC Bulldozers Kernenried-Zauggenried U15":"kernenried","SHC Bulldozers Kernenried-Zauggenried U9 weiss":"kernenried",
  "SHC Bulldozers Kernenried-Zauggenried U12":"kernenried","SHC Bulldozers Kernenried-Zauggenried U9 schwarz":"kernenried",
  "SHC Diabla 1":"diabla","SHC Valais U9":"diabla","SHC Valais Femmes":"diabla","SHC Valais U12":"diabla",
  "SHC Erlinsbach 1":"erlinsbach","SHC Erlinsbach U12":"erlinsbach","SHC Erlinsbach U15":"erlinsbach","SHC Erlinsbach U9":"erlinsbach",
  "SHC Grenchen-Limpachtal 1":"grenchen-limpachtal","SHC Grenchen-Limpachtal 2":"grenchen-limpachtal","SHC Grenchen-Limpachtal Damen":"grenchen-limpachtal",
  "SHC Grenchen-Limpachtal 3":"grenchen-limpachtal","SHC Grenchen-Limpachtal U18":"grenchen-limpachtal",
  "SHC Grenchen-Limpachtal U15 GF Grün":"grenchen-limpachtal","SHC Grenchen-Limpachtal U15 GF Weiss":"grenchen-limpachtal",
  "SHC Grenchen-Limpachtal U12 GF":"grenchen-limpachtal","SHC Grenchen-Limpachtal U9":"grenchen-limpachtal",
  "SHC La Chaux-de-Fonds 1":"la-chaux-de-fonds","SHC La Chaux-de-Fonds 2":"la-chaux-de-fonds","SHC La Chaux-de-Fonds Damen":"la-chaux-de-fonds",
  "SHC La Chaux-de-Fonds U18":"la-chaux-de-fonds","SHC La Chaux-de-Fonds U15":"la-chaux-de-fonds","SHC La Chaux-de-Fonds U12":"la-chaux-de-fonds",
  "SHC Langenthal Devils 1":"langenthal-devils",
  "SHC Martigny 1":"martigny","SHC Martigny 2":"martigny","SHC Martigny U18":"martigny","SHC Martigny U15":"martigny","SHC Martigny U12":"martigny",
  "SHC Seetal Admirals 1":"seetal-admirals","SHC Seetal Admirals 2":"seetal-admirals",
  "SHC Steckholz":"steckholz","SHC Wild Sharks":"wild-sharks",
  "Sierre Lions 1":"sierre","Sierre Lions 2":"sierre","Sierre Lions U18":"sierre",
  "SV Gals 1":"gals","SV Gals U12":"gals","SV Gals U9":"gals","SV Gals U15":"gals"
};

function kuerzelFor(teamName) {
  return teamName.replace(/^(SHC|SV|HC)\s+/, "").substring(0, 3).toUpperCase();
}
function clubSlugFor(teamName) {
  if (TEAM_CLUB[teamName]) return TEAM_CLUB[teamName];
  return teamName.replace(/^(SHC|SV|HC)\s+/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function renderAvatar(teamName) {
  var initials = kuerzelFor(teamName);
  var slug = clubSlugFor(teamName);
  return '<div class="avatar-wrap"><div class="avatar-fallback">' + initials + '</div>' +
    '<img src="logos/' + slug + '.png" alt="" ' +
    'onload="this.style.display=\'block\';this.previousElementSibling.style.display=\'none\'" ' +
    'onerror="this.remove()"></div>';
}

function text(node, tag) {
  var el = node.getElementsByTagName(tag)[0];
  return el ? el.textContent.trim() : "";
}

function directChild(parent, tagName) {
  if (!parent) return null;
  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].tagName === tagName) return parent.children[i];
  }
  return null;
}

function renderPlayerList(container, title, showNumber) {
  if (!container) return "";
  var players = container.getElementsByTagName("spieler");
  if (!players.length) return "";
  var html = '<div class="subhead">' + title + '</div>';
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    var role = text(p, "aufstellungSpielerRole");
    var number = showNumber ? ((text(p, "AufstellungNr") || text(p, "aufstellungNr")) + " ") : "";
    html += '<div class="player">' + number + text(p, "aufstellungSpieler") + (role ? " (" + role + ")" : "") + '</div>';
  }
  return html;
}

function renderLineup(team, title) {
  if (!team) return "";
  var html = '<div class="col"><h2>' + title + '</h2>';
  html += renderPlayerList(directChild(team, "aufstellungTorhueter"), "Torhüter", true);
  html += renderPlayerList(directChild(team, "aufstellungSpieler"), "Spieler", true);
  html += renderPlayerList(directChild(team, "aufstellungCoach"), "Staff", false);
  return html + "</div>";
}

function parseEvent(rawText) {
  var goalMatch = rawText.match(/^Tor für (.+?) durch (.+?)(?: auf Pass von (.+?))?\.\s*Neuer Spielstand (\d+:\d+)/);
  if (goalMatch) {
    return { type: "goal", team: goalMatch[1], scorer: goalMatch[2], assists: goalMatch[3], score: goalMatch[4] };
  }
  var penaltyMatch1 = rawText.match(/^(\d+)\s*Minutenstrafe für (.+?)\s*\((.+?)\)/);
  if (penaltyMatch1) {
    return { type: "penalty", minutes: penaltyMatch1[1] + " Min.", player: penaltyMatch1[2], team: penaltyMatch1[3] };
  }
  var penaltyMatch2 = rawText.match(/^Bankstrafen? gegen (.+?)\.\s*Die Strafe wird abgesessen von (.+)/);
  if (penaltyMatch2) {
    return { type: "penalty", minutes: "", player: penaltyMatch2[2], team: penaltyMatch2[1] };
  }
  return { type: "other", text: rawText };
}

function renderEvent(time, rawText) {
  var e = parseEvent(rawText);
  if (e.type === "goal") {
    var sub = e.scorer + (e.assists ? " – " + e.assists.replace(" und ", " / ") : "");
    return '<div class="ev"><b>' + time + '</b><span class="puck"></span><div>' + e.score + ' ' + e.team + '<div class="sub">' + sub + '</div></div></div>';
  }
  if (e.type === "penalty") {
    return '<div class="ev"><b>' + time + '</b>' + WHISTLE + '<div>' + e.team + (e.minutes ? ' · ' + e.minutes : '') + ' / ' + e.player + '</div></div>';
  }
  return '<div class="ev"><b>' + time + '</b><div>' + rawText + '</div></div>';
}

function zaehleTore(allMessages, home, away) {
  var homeGoals = 0, awayGoals = 0;
  allMessages.forEach(function(m) {
    var e = parseEvent(text(m, "text"));
    if (e.type !== "goal") return;
    if (home.indexOf(e.team) !== -1 || e.team.indexOf(home) !== -1) homeGoals++;
    else if (away.indexOf(e.team) !== -1 || e.team.indexOf(away) !== -1) awayGoals++;
  });
  return { home: homeGoals, away: awayGoals };
}

function render(d) {
  var home = text(d, "spielheimTeam");
  var away = text(d, "spielgastTeam");
  var isFinished = !!text(d, "spielende");
  var allMessages = Array.prototype.slice.call(d.getElementsByTagName("message")).reverse();
  var tickerHtml = allMessages.map(function(m) { return renderEvent(text(m, "spielzeit"), text(m, "text")); }).join("") || "<p class='status'>Noch keine Ereignisse.</p>";
  var tore = zaehleTore(allMessages, home, away);
  var updated = text(d, "last_updated").split(" ")[1] || "";

  var html = '<div class="meta-top">' + text(d, "spieldatum") + ' · ' + text(d, "spielzeit") + ' Uhr · ' + text(d, "spielort") + '</div>';

  html += isFinished
    ? '<div class="top"><span class="status-label">Spiel beendet</span></div>'
    : '<div class="top"><span class="dot"></span><span class="status-label">Live</span></div>';

  html += '<div class="score-row"><div class="team-block">' + renderAvatar(home) + '<div class="team">' + home + '</div></div>' +
    '<div class="score-card">' + tore.home + ' : ' + tore.away + '</div>' +
    '<div class="team-block">' + renderAvatar(away) + '<div class="team">' + away + '</div></div></div>';

  html += '<div class="tabs">' +
    '<button class="tab active" id="tab-ticker" onclick="switchTab(\'ticker\')">Ticker</button>' +
    '<button class="tab" id="tab-lineup" onclick="switchTab(\'lineup\')">Aufstellungen</button>' +
    '</div>';

  html += '<div class="panel active" id="panel-ticker">';
  html += '<div class="meta">Stand ' + updated + ' Uhr</div>';
  html += tickerHtml;
  html += '</div>';

  html += '<div class="panel" id="panel-lineup"><div class="lineups">';
  html += renderLineup(d.getElementsByTagName("aufstellungheim")[0], home);
  html += renderLineup(d.getElementsByTagName("aufstellunggast")[0], away);
  html += '</div></div>';

  content.innerHTML = html;
}

window.switchTab = function(name) {
  ["ticker", "lineup"].forEach(function(n) {
    document.getElementById("tab-" + n).classList.toggle("active", n === name);
    document.getElementById("panel-" + n).classList.toggle("active", n === name);
  });
};

// Test-Modus: spiel.html?demo=1 zeigt Beispieldaten inkl. Aufstellungen
var DEMO_XML =
  '<ihs><liveticker><last_updated><![CDATA[06.09.2026 14:25:46]]></last_updated>' +
  '<spielnr><![CDATA[11527]]></spielnr><spieldatum><![CDATA[06.09.2026]]></spieldatum>' +
  '<spielzeit><![CDATA[14:00]]></spielzeit><spielort><![CDATA[La Chaux-de-Fonds]]></spielort>' +
  '<spielbeginn><![CDATA[13:57]]></spielbeginn><spielende><![CDATA[]]></spielende>' +
  '<spielheimTeam><![CDATA[SHC La Chaux-de-Fonds 2]]></spielheimTeam>' +
  '<spielgastTeam><![CDATA[SHC Aegerten-Brügg 1]]></spielgastTeam>' +
  '<spieltoreheim><![CDATA[5]]></spieltoreheim><spieltoregast><![CDATA[8]]></spieltoregast>' +
  '<aufstellungheim><aufstellungTorhueter><spieler><AufstellungNr><![CDATA[96]]></AufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Humbert-Droz Quentin]]></aufstellungSpieler><aufstellungSpielerRole/></spieler></aufstellungTorhueter>' +
  '<aufstellungSpieler><spieler><AufstellungNr><![CDATA[22]]></AufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Rickli Michael]]></aufstellungSpieler><aufstellungSpielerRole/></spieler>' +
  '<spieler><AufstellungNr><![CDATA[8]]></AufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Allaz Kylian]]></aufstellungSpieler><aufstellungSpielerRole><![CDATA[C]]></aufstellungSpielerRole></spieler>' +
  '</aufstellungSpieler><aufstellungCoach><spieler><aufstellungNr><![CDATA[0]]></aufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Geissbüler Tony]]></aufstellungSpieler></spieler></aufstellungCoach></aufstellungheim>' +
  '<aufstellunggast><aufstellungTorhueter><spieler><AufstellungNr><![CDATA[25]]></AufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Demierre Nadine]]></aufstellungSpieler><aufstellungSpielerRole/></spieler></aufstellungTorhueter>' +
  '<aufstellungSpieler><spieler><AufstellungNr><![CDATA[92]]></AufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Hubacher Phil]]></aufstellungSpieler><aufstellungSpielerRole><![CDATA[C]]></aufstellungSpielerRole></spieler>' +
  '</aufstellungSpieler><aufstellungCoach><spieler><aufstellungNr><![CDATA[0]]></aufstellungNr>' +
  '<aufstellungSpieler><![CDATA[Hubacher Phil]]></aufstellungSpieler></spieler></aufstellungCoach></aufstellunggast>' +
  '<messages>' +
  '<message><spielzeit><![CDATA[44:27]]></spielzeit><text><![CDATA[Tor für SHC La Chaux-de-Fonds 2 durch Angelo Perez auf Pass von Theo Leuba. Neuer Spielstand 5:8]]></text></message>' +
  '<message><spielzeit><![CDATA[43:15]]></spielzeit><text><![CDATA[2 Minutenstrafe für David Puneet Singh (SHC Aegerten-Brügg 1)]]></text></message>' +
  '<message><spielzeit><![CDATA[41:17]]></spielzeit><text><![CDATA[Tor für SHC La Chaux-de-Fonds 2 durch Elio Cocimano. Neuer Spielstand 3:8]]></text></message>' +
  '<message><spielzeit><![CDATA[34:16]]></spielzeit><text><![CDATA[Bankstrafen gegen SHC La Chaux-de-Fonds 2. Die Strafe wird abgesessen von Hugo Zbinden]]></text></message>' +
  '<message><spielzeit><![CDATA[07:20]]></spielzeit><text><![CDATA[Tor für SHC Aegerten-Brügg 1 durch Phil Hubacher. Neuer Spielstand 0:1]]></text></message>' +
  '</messages></liveticker></ihs>';

if (new URLSearchParams(location.search).get("demo")) {
  render(new DOMParser().parseFromString(DEMO_XML, "application/xml"));
} else if (!spielnr || !seasonId) {
  content.innerHTML = '<p class="error">Kein Spiel angegeben.</p>' +
    '<div class="error-detail">Erwartet werden die Parameter <code>spielnr</code> und <code>saisonid</code> in der Adresszeile, z.B.:<br>spiel.html?spielnr=11527&amp;saisonid=17<br><br>' +
    'Zum Testen des Layouts: <a href="spiel.html?demo=1">spiel.html?demo=1</a></div>';
} else {
  var abrufUrl = WORKER + "/?path=xml/liveticker.aspx&spielnr=" + spielnr + "&saisonid=" + seasonId;
  fetch(abrufUrl)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP-Status " + r.status);
      return r.text();
    })
    .then(function(t) {
      var doc = new DOMParser().parseFromString(t, "application/xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("XML konnte nicht gelesen werden (ungültige Antwort)");
      if (!doc.getElementsByTagName("liveticker").length) throw new Error("Keine Daten zu diesem Spiel gefunden (evtl. falsche spielnr/saisonid-Kombination)");
      render(doc);
    })
    .catch(function(err) {
      content.innerHTML = '<p class="error">Spiel konnte nicht geladen werden.</p>' +
        '<div class="error-detail">' +
        'Fehler: ' + err.message + '<br>' +
        'spielnr: ' + spielnr + ' · saisonid: ' + seasonId + '<br><br>' +
        'Direkt geprüft werden kann hier: <a href="' + abrufUrl + '" target="_blank" rel="noopener">' + abrufUrl + '</a>' +
        '</div>';
    });
}
})();
</script>
</body>
</html>
